  - id: api_hn_topstories
    workspace_id: disruption
    source_type: api
    name: Hacker News Top Stories
    url: https://hacker-news.firebaseio.com/v0/topstories.json
    schedule_cron: "*/30 * * * *"
    extra:
      fetch:
        item_url_template: "https://hacker-news.firebaseio.com/v0/item/{id}.json"
        max_items_per_run: 30
      parse:
        field_map:
          id: id
          url: url
          title: title
          content: text
          summary: text
          author: by
          published_at: time

