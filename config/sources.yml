  # 2026-08-16: был web-скрейпом тега /tag/autonomous-vehicles. Отдавал посты, но с
  # published_at = NULL у ВСЕХ 33 — на странице нет ни одного <time> и ни одного
  # [datetime] (проверено на живой выдаче), а date_selector: "time" другого и не мог
  # найти. Цена этой пустоты не косметическая: _fetch_posts отбирает по
  # `published_at IS NOT NULL`, то есть все посты источника были навсегда исключены из
  # кластеризации, трендов и сигналов, оставаясь при этом в базе. Ни один алерт этого
