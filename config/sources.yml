  # ── batch:auto_hmi — воркспейс auto_hmi (добавлено 2026-08-03) ──
  # Все записи выключены. Порядок включения: сначала arXiv (дешёвый и предсказуемый,
  # проверяет весь путь), затем остальные структурированные, затем по одному telegram-каналу
  # с паузой в сутки. Записи ниже идут в этом порядке.
  #
  # schedule_cron: правило файла целиком — в шапке sources.yml. Батч auto_hmi был
  # заведён по нему сразу (2026-08-03), остальные 157 записей приведены к нему тогда же.
  # Коротко: интервал >60 только через поле часов ("<m> */2 * * *" = 120, "*/3" = 180,
  # "*/4" = 240, "*/6" = 360), шаг в минутах — только делитель 60.
  # Минута в начале строки (7, 23, 41 …) — это разнос по фазе: у каждой записи батча
  # она своя, чтобы пять telegram-каналов не приходились на одну минуту (все fetch
  # телеграма сериализуются одним _telegram_run_lock, ingest/main.py:37).
  # Оговорка: сейчас минута декларативна — cron_to_minutes возвращает только интервал,
  # а APScheduler вешает IntervalTrigger со случайным стартовым разбросом и jitter=180с
  # (ingest/main.py:182-196). Фазу она начнёт задавать, если планировщик переведут
  # на CronTrigger; до тех пор она фиксирует намерение и не даёт строке врать.
  - id: auto_rss_arxiv_cs_hc_automotive
    workspace_id: auto_hmi
    source_type: rss
    name: arXiv cs.HC — Automotive
    url: https://rss.arxiv.org/rss/cs.HC
    schedule_cron: "17 */2 * * *"
    # Включён 2026-08-03 первым в раскате auto_hmi (arXiv дешёвый и предсказуемый —
    # проверяет весь путь ingest→enrich→index до того, как включать телеграм-каналы).
    # Флаг обязан совпадать с БД: bootstrap делает ON CONFLICT DO UPDATE SET
    # is_enabled = EXCLUDED.is_enabled, то есть YAML всегда побеждает и следующий
    # bootstrap молча выключил бы источник, если оставить здесь false.
    is_enabled: true
    extra:
      rollout_batch: batch:auto_hmi
      preset: arxiv_cs_hc
      quality_tier: research
      expected_signal_types: [research, hci, ux, automotive]
      source_authority: 0.9
      filters:
        include_keywords: [automotive, in-vehicle, in-car, driver, driving, cockpit, dashboard, adas, autonomous vehicle, takeover, teleoperation]

