# Starter source bundles for workspace bootstrap.
# These entries are safe to import manually via Admin UI or API.
#
# ── schedule_cron: конвенция файла (приведено к ней 2026-08-03) ──────────────
#
# ingest/scheduler.py:cron_to_minutes НЕ разбирает cron сам: он отдаёт строку croniter,
# берёт два первых срабатывания и возвращает зазор между ними в минутах. APScheduler
# вешает на это число IntervalTrigger (ingest/main.py). Отсюда два следствия.
#
# 1. Шаг в поле МИНУТ раскрывается по диапазону 0-59, а не по времени. range(0, 60, 90)
#    это [0], поэтому "*/90", "*/120", "*/180", "*/240", "*/360" — все до одного ровно
#    60 минут. Источник, заявивший «раз в 6 часов», опрашивался раз в час: в шесть раз
#    чаще написанного, без лога, метрики и ошибки. "*/45" раскрывается в [0, 45] и даёт
#    45 ИЛИ 15 минут — что именно, решает минута настенных часов в момент старта ingest.
# 2. Интервал больше 60 выражается ТОЛЬКО через поле часов:
#      "<m> */2 * * *" = 120,  "<m> */3 * * *" = 180,
#      "<m> */4 * * *" = 240,  "<m> */6 * * *" = 360.
#    Шаг в поле минут допустим только если он делит 60 (1, 2, 3, 4, 5, 6, 10, 12, 15,
#    20, 30, 60); всё остальное врёт. Полчаса с офсетом пишутся парой: "<m>,<m+30> * * * *".
#
# Правило пересчёта прежних значений: ближайший ВЫРАЗИМЫЙ интервал, при ничьей — БОЛЬШИЙ
# (реже опрашиваем). 120 → 120, 180 → 180, 240 → 240, 360 → 360 выражаются точно;
# 90 → 120 (ничья 60/120) и 45 → 60 (ничья 30/60) округлены вверх. Тай-брейк выбран
# так, чтобы ни один источник не начал опрашиваться ЧАЩЕ, чем сегодня: 123 записи стали
# реже в 2-6 раз, 45 остались с прежней частотой, ни одна не участилась.
#
# Минута в начале строки — разнос по фазе: внутри одного интервального бакета она у
# каждого источника своя, чтобы 168 записей не приходились на минуту 0 (все fetch
# телеграма сериализуются одним _telegram_run_lock, ingest/main.py).
# Оговорка: сегодня минута ДЕКЛАРАТИВНА. cron_to_minutes возвращает только интервал,
# а APScheduler вешает IntervalTrigger со случайным стартовым разбросом и jitter=180с
# (ingest/main.py). Фазу она начнёт задавать, если планировщик переведут на CronTrigger;
# до тех пор она фиксирует намерение и не даёт строке врать.
#
# Контракт держится тестом tests/test_cron_contract.py — там же модель croniter
# (в admin-образе croniter не установлен, а conftest подменяет его MagicMock).
#
# ── extra.filters: только для structured-источников ──────────────────────────
#
# matches_filters живёт в StructuredSource (ingest/sources/base.py) и вызывается ровно
# из StructuredSource.fetch. TelegramSource наследуется от AbstractSource и пишет свой
# fetch() сам, мимо этого пути, — блок filters у telegram НИКОГДА не применяется.
# 2026-08-03 такие блоки удалены у девяти telegram-записей (tg_ru_autoruonline,
# tg_ru_autostatis, tg_ru_russianev, tg_ru_avtovaz_official, tg_ru_nami_russia,
# tg_ru_yandex_auto, tg_ru_sber_auto, tg_ru_izvestia_auto, tg_ru_rbc_auto): все
# заявляли lang_allow: [ru], шесть из них — ещё и include/exclude_keywords по авто-теме.
# Ни один не отсекал ничего; поток у этих каналов идёт целиком и всегда шёл, отбор
# делает только LLM ниже по трубе. Записанный, но не работающий фильтр хуже
# отсутствующего — следующий читатель считает поток отфильтрованным.
# Не возвращать сюда filters для telegram: tests/test_sources_config_contract.py
# краснеет на этом жёстко, без реестра исключений.
