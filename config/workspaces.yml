workspaces:
  - id: disruption
    name: "Disruption Intelligence"
    description: "Frontier signals for visionary design and strategic disruption"
    categories:
      - technology
      - design
      - business_models
      - society
      - science
    relevance_weights:
      threshold: 0.6
      technology: 1.0
      design: 1.2
      business_models: 0.9
      society: 0.8
      science: 0.85
    design_lenses:
      - "futures_thinking"
      - "systems_design"
      - "experience_design"
    cross_workspace_bridges:
      - ai_trends
      - ai_research
      - ai_products_media
      - design
    is_active: true
    extra:
      cluster_analysis:
        # Единственное переопределение: потолок выборки. Остальные параметры
        # сознательно оставлены дефолтными — правится ровно то, что сломано.
        #
        # disruption — самый крупный воркспейс (~1000 подходящих постов в сутки,
        # 28 951 в 30-дневном окне), и при этом единственный, которому потолок
        # так и не настроили: он сидел на дефолтных 400 из shared/config.py,
        # тогда как ai_trends получил 550, ai_research и ai_products_media — 500,
        # design — 650. Крон один раз в сутки, выборка берёт 400 САМЫХ СВЕЖИХ
        # постов окна (ORDER BY published_at DESC LIMIT), поэтому в кластеризацию
        # попадали примерно последние девять часов ленты, а остальное не попадало
        # никогда. Замер 04.08.2026: покрытие в окне 39.3% против 95-99%
        # у всех прочих воркспейсов.
        #
        # 2000 = двукратный запас к суточному потоку. Тот же порядок, что у
        # соседей (у них 1.7-2.2x к своему потоку). Backfill не нужен: окно
        # скользящее, поэтому при полном покрытии новых постов старые
        # некластеризованные просто выкатятся из него за 30 суток.
        #
        # Цена — матрица попарных косинусов O(n^2): при 2000 это ~128 МБ на
        # четыре временные матрицы против ~5 МБ при 400. Лимит памяти worker 2g.
        semantic_cluster_max_posts: 2000
        #
        # 2026-08-16: здесь недолго стоял semantic_cluster_archive_hours: 96 —
        # окно архива сужали втрое, чтобы унять memcg-SIGKILL у run_signal_analysis.
        # Ключ убран в тот же день: причину устранили в коде, а не конфигом.
        # _components_np больше не материализует полную матрицу N*N, а идёт блоками
        # под фиксированный бюджет байт (коммит 19af234), и прибавка пасса стала
        # константой по N — замер 265 МБ при N=5000, 8000 и 9520. Прогон на полном
        # окне 336 ч после этого прошёл: 9520 кластеров, пик 3.78 из 4 GiB,
        # oom_kill 0, пять стабильных трендов — первых у disruption за недели.
        #
        # Не заводить снова без НОВОГО основания: ключ читают ТРИ потребителя, и
        # память — только один из них. Остальные два стоят продукта. В суточной
        # run_semantic_clustering по этому же окну _semantic_identity опознаёт
        # прежние кластеры: при 96 ч кластер старше четырёх суток не находится,
        # на повторяющуюся тему заводится новая строка, рвётся signal_time_series,
        # а из него считаются velocity и acceleration, входящие в балл сигнала.
        # Плюс _lifecycle_updates архивирует не с 14 суток, а с 4.

  - id: ai_trends
    name: "AI Trends Intelligence"
    description: "LLM, agents, AI tools, research and inference signals"
    categories:
      - technology
      - science
      - business_models
    relevance_weights:
      threshold: 0.62
      technology: 1.25
      science: 1.15
      business_models: 0.95
    design_lenses:
      - "agentic_systems"
      - "applied_research"
      - "platform_strategy"
    cross_workspace_bridges:
      - disruption
      - design
    extra:
      cluster_analysis:
        semantic_cluster_window_days: 10
        semantic_cluster_max_posts: 550
        semantic_dedupe_similarity_threshold: 0.91
        semantic_dedupe_max_gap_hours: 120
        semantic_merge_enabled: true
        semantic_merge_similarity_threshold: 0.68
        semantic_merge_title_overlap_threshold: 0.34
        semantic_merge_concept_overlap_threshold: 0.45
        semantic_merge_max_gap_hours: 240
        trend_cluster_similarity_threshold: 0.84
        trend_cluster_max_gap_hours: 504
        trend_cluster_min_semantic_clusters: 2
        # 2026-08-12: см. комментарий у design. Тот же замер по ai_trends:
        # при 0.6/4 проходит ноль кандидатов, при 0.5/2 — четыре
        # (0.45 и 0.42 не добавляют ни одного, поэтому ниже 0.5 не опускаем).
        # За 12 суток здесь случился ровно один stable — 11.08, остальные дни ноль.
        trend_cluster_min_docs: 2
        trend_cluster_stable_threshold: 0.5
        trend_cluster_emerging_threshold: 0.5
        trend_cluster_min_source_diversity: 0.32
        cluster_min_evidence_count: 3
        signal_velocity_weight: 0.1
        signal_acceleration_weight: 0.08
        # signal_merge_* убраны 16.08.2026 вместе с самим слиянием сигналов: предикат
        # был недостижим по построению (кандидаты — связные компоненты, они разбивают
        # множество, поэтому пересечения документов не бывает никогда). Понижение
        # порога здесь до 0.58 было попыткой это обойти и тоже не дало ни одного
        # слияния. Разбор — в комментарии на месте удаления, в _signal_results.
        signal_min_source_count: 2
        persist_weak_signals: false
        weak_signal_min_score: 0.54
        weak_signal_min_confidence: 0.6
        weak_signal_min_source_diversity: 0.32
        weak_signal_min_source_count: 2
    is_active: true

  - id: ai_research
    name: "AI Research Intelligence"
    description: "Research-first AI signals: papers, model advances, benchmarks, and technical methods"
    categories:
      - technology
      - science
    relevance_weights:
      threshold: 0.64
      technology: 1.15
      science: 1.3
    design_lenses:
      - "applied_research"
      - "technical_novelty"
      - "model_capabilities"
    cross_workspace_bridges:
      - disruption
      - ai_trends
      - ai_products_media
    extra:
      cluster_analysis:
        semantic_cluster_window_days: 12
        semantic_cluster_max_posts: 500
        semantic_dedupe_similarity_threshold: 0.92
        semantic_dedupe_max_gap_hours: 168
        trend_cluster_similarity_threshold: 0.86
        trend_cluster_max_gap_hours: 504
        trend_cluster_min_semantic_clusters: 2
        trend_cluster_min_docs: 4
        trend_cluster_stable_threshold: 0.62
        trend_cluster_emerging_threshold: 0.52
        trend_cluster_min_source_diversity: 0.28
        cluster_min_evidence_count: 3
        signal_min_source_count: 2
        persist_weak_signals: false
    is_active: true

  - id: ai_products_media
    name: "AI Products & Media Intelligence"
    description: "Product launches, platform moves, AI tooling, developer buzz, and media narratives"
    categories:
      - technology
      - business_models
    relevance_weights:
      threshold: 0.62
      technology: 1.2
      business_models: 1.1
    design_lenses:
      - "platform_strategy"
      - "agentic_systems"
      - "productization"
    cross_workspace_bridges:
      - disruption
      - ai_trends
      - ai_research
      - design
    extra:
      cluster_analysis:
        semantic_cluster_window_days: 9
        semantic_cluster_max_posts: 500
        semantic_dedupe_similarity_threshold: 0.9
        semantic_dedupe_max_gap_hours: 120
        semantic_merge_enabled: true
        semantic_merge_similarity_threshold: 0.7
        semantic_merge_title_overlap_threshold: 0.34
        semantic_merge_concept_overlap_threshold: 0.45
        semantic_merge_max_gap_hours: 240
        trend_cluster_similarity_threshold: 0.84
        trend_cluster_max_gap_hours: 336
        trend_cluster_min_semantic_clusters: 2
        trend_cluster_min_docs: 4
        trend_cluster_stable_threshold: 0.6
        trend_cluster_emerging_threshold: 0.5
        trend_cluster_min_source_diversity: 0.32
        cluster_min_evidence_count: 3
        signal_min_source_count: 2
        persist_weak_signals: false
    is_active: true

  - id: design
    name: "Design Intelligence"
    description: "Design systems, UX patterns, interface shifts and visual culture"
    categories:
      - design
      - technology
      - business_models
    relevance_weights:
      threshold: 0.6
      design: 1.3
      technology: 0.95
      business_models: 0.8
    design_lenses:
      - "interaction_design"
      - "service_design"
      - "visual_culture"
    cross_workspace_bridges:
      - disruption
      - ai_trends
      - ai_products_media
      - ai_research
    extra:
      cluster_analysis:
        semantic_cluster_window_days: 12
        semantic_cluster_max_posts: 650
        semantic_dedupe_similarity_threshold: 0.89
        semantic_dedupe_max_gap_hours: 168
        trend_cluster_similarity_threshold: 0.85
        # 2026-08-12: 24ч были аномалией (ai_trends 504, ai_products_media 336,
        # дефолт 720). Параметр задаёт максимальный разрыв между постами внутри одной
        # трендовой группы, то есть работает ДО всех порогов, на составе группы.
        # При сутках группа собиралась только из постов одного дня, а источники design
        # (недельные дайджесты, NN/g) в пределах суток не пересекаются: из 309
        # кандидатов лишь 7 имели два источника. Приводим к окну воркспейса (21 день).
        trend_cluster_max_gap_hours: 504
        trend_cluster_window_days: 21
        trend_cluster_min_semantic_clusters: 2
        # 2026-08-12: ворота промоушена в stable смягчены. Замер по 704 кандидатам
        # последнего прогона: структурные ворота пропускали 2, порог балла 0.56 — 6,
        # пересечение — НОЛЬ, отсюда 0 стабильных трендов за 12 суток подряд при
        # 3-8 emerging ежедневно. min_docs 3->2 и stable 0.56->0.50 дают 4 кандидата;
        # ниже 0.50 опускать бессмысленно — 0.45 и 0.42 не добавляют ни одного.
        # min_semantic_clusters, min_source_diversity и signal_min_source_count НЕ
        # трогали: все 4 проходящих кандидата имеют diversity >= 1.0 при пороге 0.28,
        # то есть барьер независимости источников не был узким местом.
        trend_cluster_min_docs: 2
        trend_cluster_stable_threshold: 0.5
        trend_cluster_emerging_threshold: 0.38
        trend_cluster_min_source_diversity: 0.28
        cluster_min_evidence_count: 2
    is_active: true

  # auto_hmi (2026-08-03): автомобильные интерфейсы, софт автомобиля и рыночный контекст вокруг них.
  # Читаются только name, categories (подставляются в worker/prompts/relevance.txt) и
  # relevance_weights.threshold (worker/tasks/enrichment_task.py:758). Категорийные веса и
  # cross_workspace_bridges намеренно не заданы — их не читает никто.
  # Каждая категория несёт автомобильный квалификатор, но сама по себе категория "other"
  # НИЧЕГО не отсекает: _is_relevant возвращает True по score >= threshold ДО проверки
  # категории (relevance_chain.py:229-235; в joint-цепочке по умолчанию тот же порядок,
  # relevance_concepts_chain.py:236-238). "other" закрывает только серую зону, поэтому
  # фактическая отсечка — 0.55 для "other" и 0.45 (threshold - gigachat_relevance_gray_zone)
  # для шести категорий ниже. Единственный рычаг здесь — формулировки categories: если доля
  # embedding_status='dropped' окажется выше 70%, править надо их, а не threshold.
  - id: auto_hmi
    name: "Automotive HMI Intelligence"
    # Описание намеренно короткое и без перечисления доменных слов. Строка целиком уходит в
    # стоп-лист gap-анализа (worker/services/missing_signals.py:232-248 собирает его из
    # name + description + categories + design_lenses), и прежний вариант «In-vehicle
    # interfaces, cockpit software, driver assistance...» выбивал из кандидатов ещё и
    # cockpit / in-vehicle / interfaces — то есть список тем сам себя обнулял.
    description: "Мониторинг автомобильного направления"
    categories:
      - vehicle_hmi
      - vehicle_software
      - driver_assistance
      - vehicle_design
      - auto_market
      - mobility_services
    relevance_weights:
      threshold: 0.55
    design_lenses:
      - "automotive_hmi"
      - "in_vehicle_experience"
      - "software_defined_vehicle"
    extra:
      cluster_analysis:
        semantic_cluster_window_days: 14
        trend_cluster_min_docs: 3
        trend_cluster_stable_threshold: 0.56
        trend_cluster_emerging_threshold: 0.38
        # trend_cluster_min_source_diversity намеренно НЕ задан — работает глобальный
        # дефолт 0.2 (worker/services/semantic_clustering.py:700-702), самый мягкий из
        # доступных. Гейт читается на стадиях stable (:1841) и emerging (:1849), а
        # source_diversity = len(source_ids) / max(len(semantic_group), 2). auto_hmi
        # неделями живёт на 1-3 включённых источниках, то есть имеет наименее
        # достижимую diversity в системе: любое значение выше дефолта держало бы
        # воркспейс в стадии weak. Все остальные ключи блока тоже ослаблены —
        # поднимать здесь единственный порог было бы противоречием.
        persist_weak_signals: true
    is_active: true
