x-docker-json-logging: &docker-json-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── CORE ─────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frontier}
      POSTGRES_USER: ${POSTGRES_USER:-frontier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # $$ — подстановка env внутри контейнера (см. Docker Compose / healthcheck)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  redis:
    image: redis:7-alpine
    profiles: [core]
    # maxmemory 2gb: 512mb не хватало — 31.07.2026 event-bus стримы упёрлись в потолок
    # и Redis начал отвечать OOM на каждую запись, положив ingest, enrichment и поиск.
    # Потолок длины самих стримов задаётся STREAM_MAXLEN в shared/redis_client.py —
    # менять эти два значения согласованно.
    # volatile-ttl оставлен намеренно: TTL есть только у кэша эмбеддингов, поэтому под
    # давлением вытесняется именно он, а стримы (без TTL) остаются нетронутыми.
    command: redis-server --save 60 1 --loglevel warning --maxmemory 2gb --maxmemory-policy volatile-ttl
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  qdrant:
    image: qdrant/qdrant:v1.17.0
    profiles: [core]
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    # Образ qdrant без curl/wget; entrypoint на bash — проверка TCP :6333 (см. docs/ops-server-troubleshooting.md)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:6333/readyz 2>/dev/null || wget -qO- http://127.0.0.1:6333/readyz >/dev/null 2>&1 || bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  neo4j:
    image: neo4j:5.15-community
    profiles: [core]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:7474/ 2>/dev/null || curl -sf http://127.0.0.1:7474/ 2>/dev/null || bash -c 'exec 3<>/dev/tcp/127.0.0.1/7474'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  gpt2giga-proxy:
    build:
      context: ./gpt2giga-proxy
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    profiles: [core]
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 127.0.0.11
    environment:
      FRONTIER_RUNTIME_MODE: ${FRONTIER_RUNTIME_MODE:-custom}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-}
      GIGACHAT_MAX_RETRIES: ${GIGACHAT_MAX_RETRIES:-3}
      GIGACHAT_RETRY_BACKOFF_FACTOR: ${GIGACHAT_RETRY_BACKOFF_FACTOR:-0.5}
      GIGACHAT_VERIFY_SSL_CERTS: ${GIGACHAT_VERIFY_SSL_CERTS:-False}
      GPT2GIGA_HOST: 0.0.0.0
      GPT2GIGA_PROXY_PORT: 8090
      GPT2GIGA_LOG_LEVEL: ${GPT2GIGA_LOG_LEVEL:-INFO}
      GPT2GIGA_TIMEOUT: 600
      GPT2GIGA_EMBEDDINGS: ${GIGACHAT_EMBEDDINGS_MODEL:-EmbeddingsGigaR}
      GPT2GIGA_PASS_MODEL: ${GPT2GIGA_PASS_MODEL:-True}
      GPT2GIGA_ENABLE_IMAGES: ${GPT2GIGA_ENABLE_IMAGES:-True}
      GPT2GIGA_VERBOSE: "False"
    ports:
      - "127.0.0.1:8090:8090"
    # Liveness: порт слушает (не зависит от ответа GigaChat на /v1/models)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket;s=socket.socket();s.settimeout(3);s.connect(('127.0.0.1',8090));s.close()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  # ── INGEST ───────────────────────────────────────────────────────────────────

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    profiles: [ingest]
    environment:
      FRONTIER_RUNTIME_MODE: ${FRONTIER_RUNTIME_MODE:-custom}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-frontier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-frontier}
      REDIS_URL: redis://redis:6379
      GIGACHAT_PROXY_URL: http://gpt2giga-proxy:8090
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-ru-central-1}
      TG_API_ID_0: ${TG_API_ID_0}
      TG_API_HASH_0: ${TG_API_HASH_0}
      TG_API_ID_1: ${TG_API_ID_1:-}
      TG_API_HASH_1: ${TG_API_HASH_1:-}
      # Telethon: SOCKS5 / MTProxy для Telegram DC (gpt2giga-proxy:8090 — только API модели, сюда не подставлять)
      TG_SOCKS5: ${TG_SOCKS5:-}
      TG_PROXY_DSN: ${TG_PROXY_DSN:-}
      TG_PROXY_HOST: ${TG_PROXY_HOST:-}
      TG_PROXY_PORT: ${TG_PROXY_PORT:-1080}
      TG_PROXY_USER: ${TG_PROXY_USER:-}
      TG_PROXY_PASS: ${TG_PROXY_PASS:-}
      WG_SOCKS_HOST: ${WG_SOCKS_HOST:-}
      WG_SOCKS_PORT: ${WG_SOCKS_PORT:-1080}
      WG_SOCKS_USER: ${WG_SOCKS_USER:-}
      WG_SOCKS_PASS: ${WG_SOCKS_PASS:-}
      MTPROXY_HOST: ${MTPROXY_HOST:-}
      MTPROXY_PORT: ${MTPROXY_PORT:-443}
      MTPROXY_SECRET: ${MTPROXY_SECRET:-}
      # 1/true/on — выход при старте, если в env нет прокси для Telethon (per-source в БД не считается)
      TG_REQUIRE_PROXY: ${TG_REQUIRE_PROXY:-}
      HOSTNAME: ingest-0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./sessions:/app/sessions
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      xray:
        condition: service_started
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  xray:
    build:
      context: .
      dockerfile: services/xray/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    profiles: [xray]
    environment:
      XRAY_VLESS_ADDRESS: ${XRAY_VLESS_ADDRESS:-}
      XRAY_VLESS_PORT: ${XRAY_VLESS_PORT:-443}
      XRAY_VLESS_ID: ${XRAY_VLESS_ID:-}
      XRAY_VLESS_FLOW: ${XRAY_VLESS_FLOW:-xtls-rprx-vision}
      XRAY_REALITY_SNI: ${XRAY_REALITY_SNI:-}
      XRAY_REALITY_FP: ${XRAY_REALITY_FP:-chrome}
      XRAY_REALITY_PBK: ${XRAY_REALITY_PBK:-}
      XRAY_REALITY_SID: ${XRAY_REALITY_SID:-}
      XRAY_PROFILE_REGISTRY_PATH: ${XRAY_PROFILE_REGISTRY_PATH:-/runtime/xray-profiles.json}
      XRAY_ACTIVE_PROFILE_PATH: ${XRAY_ACTIVE_PROFILE_PATH:-/runtime/xray-active-profile.txt}
      XRAY_PREVIOUS_PROFILE_PATH: ${XRAY_PREVIOUS_PROFILE_PATH:-/runtime/xray-previous-profile.txt}
      XRAY_RELOAD_TRIGGER_PATH: ${XRAY_RELOAD_TRIGGER_PATH:-/runtime/xray-reload.trigger}
      XRAY_RELOAD_POLL_SECONDS: ${XRAY_RELOAD_POLL_SECONDS:-2}
      XRAY_SOCKS_PORT: ${XRAY_SOCKS_PORT:-10808}
      XRAY_LOG_LEVEL: ${XRAY_LOG_LEVEL:-warning}
    volumes:
      - ./services/xray/run-xray.sh:/etc/xray/run-xray.sh:ro
      - ${FRONTIER_RUNTIME_DIR:-/opt/frontier-intelligence/runtime}:/runtime
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  # ── WORKER ───────────────────────────────────────────────────────────────────

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    profiles: [worker]
    environment:
      FRONTIER_RUNTIME_MODE: ${FRONTIER_RUNTIME_MODE:-custom}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-frontier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-frontier}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-frontier_docs}
      QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:-}
      QDRANT_TRENDS_COLLECTION: ${QDRANT_TRENDS_COLLECTION:-trend_clusters}
      QDRANT_TRENDS_COLLECTION_ALIAS: ${QDRANT_TRENDS_COLLECTION_ALIAS:-}
      QDRANT_FILTER_EMBEDDING_VERSION: ${QDRANT_FILTER_EMBEDDING_VERSION:-true}
      QDRANT_ENFORCE_COLLECTION_SCHEMA: ${QDRANT_ENFORCE_COLLECTION_SCHEMA:-true}
      # own_stake (задача B) здесь НЕ пробрасывается, и это проверенное решение, а не
      # пропуск. QdrantHybridClient.__init__ выставляет self.own_corpus_collection в любом
      # процессе, но в worker/, admin/ и ingest/ нет ни одного вызова own_stake_scores /
      # upsert_own_corpus_chunk / own_corpus_size — атрибут собирается и не читается.
      # Ось считается на поиске в mcp, коллекцию заводит scripts/init_storage.py, а корпус
      # индексирует scripts/index_own_corpus.py — обе запускаются с хоста и читают .env
      # напрямую, мимо compose. Появится вызов own-corpus внутри worker — добавлять сюда.
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_BASE: http://gpt2giga-proxy:8090/v1
      GIGACHAT_PROXY_URL: http://gpt2giga-proxy:8090
      WORMSOFT_API_BASE: ${WORMSOFT_API_BASE:-https://ai.wormsoft.ru/api/gpt}
      WORMSOFT_API_KEY: ${WORMSOFT_API_KEY:-}
      WORMSOFT_MODEL_DEFAULT: ${WORMSOFT_MODEL_DEFAULT:-wormsoft/agent/medium}
      WORMSOFT_MODEL_MCP_SYNTHESIS: ${WORMSOFT_MODEL_MCP_SYNTHESIS:-wormsoft/agent/high}
      WORMSOFT_VISION_MODEL: ${WORMSOFT_VISION_MODEL:-wormsoft/vision/medium}
      WORMSOFT_MAX_SIMULTANEOUS_REQUESTS: ${WORMSOFT_MAX_SIMULTANEOUS_REQUESTS:-1}
      WORMSOFT_MIN_REQUEST_INTERVAL_MS: ${WORMSOFT_MIN_REQUEST_INTERVAL_MS:-2000}
      WORMSOFT_MAX_RETRIES: ${WORMSOFT_MAX_RETRIES:-0}
      WORMSOFT_SHARED_GUARD_ENABLED: ${WORMSOFT_SHARED_GUARD_ENABLED:-true}
      WORMSOFT_CREDIT_THROTTLE_ENABLED: ${WORMSOFT_CREDIT_THROTTLE_ENABLED:-false}
      WORMSOFT_CREDIT_WINDOW_LIMIT: ${WORMSOFT_CREDIT_WINDOW_LIMIT:-500000}
      WORMSOFT_CREDIT_WINDOW_SECONDS: ${WORMSOFT_CREDIT_WINDOW_SECONDS:-18000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_REFERRER: ${OPENROUTER_REFERRER:-https://frontier-intelligence.local}
      OPENROUTER_TEXT_MODEL: ${OPENROUTER_TEXT_MODEL:-openrouter/free}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-openrouter/free}
      OPENROUTER_FREE_RPM_THROTTLE: ${OPENROUTER_FREE_RPM_THROTTLE:-18}
      OPENROUTER_FREE_RPD_SOFT_CAP: ${OPENROUTER_FREE_RPD_SOFT_CAP:-850}
      OPENROUTER_FREE_QUARANTINE_5XX_SEC: ${OPENROUTER_FREE_QUARANTINE_5XX_SEC:-900}
      OPENROUTER_HEALTH_PROBE_TIMEOUT_SEC: ${OPENROUTER_HEALTH_PROBE_TIMEOUT_SEC:-20}
      OPENROUTER_HEALTH_PROBE_MAX_TOKENS: ${OPENROUTER_HEALTH_PROBE_MAX_TOKENS:-1}
      OPENROUTER_PICKER_STICKY_SEC: ${OPENROUTER_PICKER_STICKY_SEC:-600}
      OPENROUTER_RPD_SAFETY_BUFFER: ${OPENROUTER_RPD_SAFETY_BUFFER:-0.1}
      OPENROUTER_QUARANTINE_5XX_THRESHOLD: ${OPENROUTER_QUARANTINE_5XX_THRESHOLD:-3}
      OPENROUTER_QUARANTINE_5XX_WINDOW_SEC: ${OPENROUTER_QUARANTINE_5XX_WINDOW_SEC:-300}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
      POLZA_BASE_URL: ${POLZA_BASE_URL:-https://polza.ai/api/v1}
      POLZA_TEXT_MODEL: ${POLZA_TEXT_MODEL:-deepseek/deepseek-v3.2}
      POLZA_SYNTHESIS_MODEL: ${POLZA_SYNTHESIS_MODEL:-deepseek/deepseek-v3.2}
      POLZA_VISION_MODEL: ${POLZA_VISION_MODEL:-}
      NOVELTY_JUDGE_FALLBACK_MODEL: ${NOVELTY_JUDGE_FALLBACK_MODEL:-deepseek/deepseek-v3.2}
      GIGACHAT_EMBEDDINGS_MODEL: ${GIGACHAT_EMBEDDINGS_MODEL:-EmbeddingsGigaR}
      GIGACHAT_MODEL_LITE: ${GIGACHAT_MODEL_LITE:-GigaChat-2}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
      GIGACHAT_MODEL_PRO: ${GIGACHAT_MODEL_PRO:-GigaChat-2-Pro}
      GIGACHAT_MODEL_MAX: ${GIGACHAT_MODEL_MAX:-GigaChat-2-Max}
      GIGACHAT_MODEL_RELEVANCE: ${GIGACHAT_MODEL_RELEVANCE:-}
      GIGACHAT_MODEL_CONCEPTS: ${GIGACHAT_MODEL_CONCEPTS:-}
      GIGACHAT_MODEL_VALENCE: ${GIGACHAT_MODEL_VALENCE:-}
      GIGACHAT_MODEL_MCP_SYNTHESIS: ${GIGACHAT_MODEL_MCP_SYNTHESIS:-}
      GIGACHAT_VISION_MODEL: ${GIGACHAT_VISION_MODEL:-}
      GIGACHAT_SESSION_CACHE_ENABLED: ${GIGACHAT_SESSION_CACHE_ENABLED:-true}
      GIGACHAT_ESCALATION_ENABLED: ${GIGACHAT_ESCALATION_ENABLED:-true}
      GIGACHAT_TOKEN_BUDGET_RELEVANCE: ${GIGACHAT_TOKEN_BUDGET_RELEVANCE:-1500}
      GIGACHAT_TOKEN_BUDGET_CONCEPTS: ${GIGACHAT_TOKEN_BUDGET_CONCEPTS:-1500}
      GIGACHAT_TOKEN_BUDGET_VALENCE: ${GIGACHAT_TOKEN_BUDGET_VALENCE:-1200}
      GIGACHAT_TOKEN_BUDGET_RELEVANCE_CONCEPTS: ${GIGACHAT_TOKEN_BUDGET_RELEVANCE_CONCEPTS:-1800}
      GIGACHAT_TOKEN_BUDGET_EMBED: ${GIGACHAT_TOKEN_BUDGET_EMBED:-1200}
      GIGACHAT_TOKEN_BUDGET_VISION_PROMPT: ${GIGACHAT_TOKEN_BUDGET_VISION_PROMPT:-600}
      GIGACHAT_RELEVANCE_GRAY_ZONE: ${GIGACHAT_RELEVANCE_GRAY_ZONE:-0.1}
      GIGACHAT_RC_JOINT_ENABLED: ${GIGACHAT_RC_JOINT_ENABLED:-false}
      GIGACHAT_RC_JOINT_WORKSPACES: ${GIGACHAT_RC_JOINT_WORKSPACES:-}
      GIGACHAT_RC_JOINT_SOURCES: ${GIGACHAT_RC_JOINT_SOURCES:-}
      GIGACHAT_MAX_SIMULTANEOUS_REQUESTS: ${GIGACHAT_MAX_SIMULTANEOUS_REQUESTS:-1}
      GIGACHAT_MIN_REQUEST_INTERVAL_MS: ${GIGACHAT_MIN_REQUEST_INTERVAL_MS:-250}
      INDEXING_MAX_CONCURRENCY: ${INDEXING_MAX_CONCURRENCY:-2}
      VISION_ENABLED: ${VISION_ENABLED:-true}
      VISION_ROUTING_ENABLED: ${VISION_ROUTING_ENABLED:-true}
      VISION_CLAIM_IDLE_MS: ${VISION_CLAIM_IDLE_MS:-600000}
      VISION_MAX_DELIVERY_COUNT: ${VISION_MAX_DELIVERY_COUNT:-5}
      VISION_DLQ_STREAM: ${VISION_DLQ_STREAM:-stream:posts:vision:dlq}
      EMBED_DIM: ${EMBED_DIM:-2560}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-ru-central-1}
      SEARXNG_URL: http://searxng:8080
      # Gap-анализ (missing signals) живёт в worker/services/missing_signals.py.
      # Долгоживущий процесс worker его не крутит (worker/main.py — только
      # enrichment/reindex/vision), но образ несёт и код, и scripts/, поэтому
      # `docker compose exec worker python scripts/run_semantic_clustering.py <ws>`
      # запускает ровно ту же функцию. Без проброса ручной прогон считал бы по
      # дефолтам из shared/config.py, а плановый — по .env: два разных ответа на
      # одних данных. Значения по умолчанию обязаны совпадать с shared/config.py.
      SEARXNG_ENABLED: ${SEARXNG_ENABLED:-true}
      SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES:-general,news}
      SEARXNG_MAX_RESULTS: ${SEARXNG_MAX_RESULTS:-5}
      SEARXNG_TIMEOUT_SECONDS: ${SEARXNG_TIMEOUT_SECONDS:-8}
      SEARXNG_CACHE_TTL: ${SEARXNG_CACHE_TTL:-3600}
      # Инвалидатор кэша поиска: входит в материал ключа _cache_key. Пусто — кэш
      # не инвалидируется правкой searxng/settings.yml (см. .env.example).
      SEARXNG_ENGINES_FINGERPRINT: ${SEARXNG_ENGINES_FINGERPRINT:-}
      SEARXNG_EMPTY_CACHE_TTL: ${SEARXNG_EMPTY_CACHE_TTL:-120}
      MISSING_SIGNALS_ENABLED: ${MISSING_SIGNALS_ENABLED:-true}
      MISSING_SIGNALS_TOPIC_LIMIT: ${MISSING_SIGNALS_TOPIC_LIMIT:-8}
      MISSING_SIGNALS_MIN_GAP_SCORE: ${MISSING_SIGNALS_MIN_GAP_SCORE:-0.33}
      MISSING_SIGNALS_PRESENCE_SATURATION: ${MISSING_SIGNALS_PRESENCE_SATURATION:-0.30}
      MISSING_SIGNALS_MIN_EXTERNAL_RESULTS: ${MISSING_SIGNALS_MIN_EXTERNAL_RESULTS:-2}
      MISSING_SIGNALS_MAX_EVIDENCE_URLS: ${MISSING_SIGNALS_MAX_EVIDENCE_URLS:-5}
      MISSING_SIGNALS_TIME_RANGE: ${MISSING_SIGNALS_TIME_RANGE:-month}
      MISSING_SIGNALS_LANGUAGE: ${MISSING_SIGNALS_LANGUAGE:-auto}
      PADDLEOCR_URL: ${PADDLEOCR_URL:-}
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      gpt2giga-proxy:
        condition: service_started
      searxng:
        condition: service_healthy
    logging: *docker-json-logging
    restart: unless-stopped
    volumes:
      - fastembed_cache:/cache
    networks: [frontier-net]

  # ── PaddleOCR (опционально, как в telegram-assistant) ───────────────────────
  paddleocr:
    build:
      context: .
      dockerfile: services/paddleocr/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    profiles: [paddleocr]
    environment:
      # По умолчанию false: сервис поднимается без скачивания с BCE (DNS/сеть). true — в .env при доступе к paddleocr.bj.bcebos.com
      LOCAL_OCR_PRELOAD: "${LOCAL_OCR_PRELOAD:-false}"
      LOCAL_OCR_DET_MODEL_DIR: "${LOCAL_OCR_DET_MODEL_DIR:-}"
      LOCAL_OCR_REC_MODEL_DIR: "${LOCAL_OCR_REC_MODEL_DIR:-}"
      LOCAL_OCR_CLS_MODEL_DIR: "${LOCAL_OCR_CLS_MODEL_DIR:-}"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Кэш весов PP-OCR (как устойчивость к пересозданию; в telegram-assistant в dev — mount всего репо)
      - paddleocr_models:/root/.paddleocr
    ports:
      - "127.0.0.1:${PADDLEOCR_PORT:-8008}:8008"
    deploy:
      resources:
        limits:
          memory: 4g
    # Readiness только после загрузки весов (см. GET /readyz)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8008/readyz >/dev/null || wget -qO- http://127.0.0.1:8008/readyz >/dev/null 2>&1 || python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/readyz', timeout=5)\"",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 600s
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  # ── MCP ──────────────────────────────────────────────────────────────────────

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    profiles: [mcp]
    environment:
      FRONTIER_RUNTIME_MODE: ${FRONTIER_RUNTIME_MODE:-custom}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-frontier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-frontier}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-frontier_docs}
      QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:-}
      QDRANT_TRENDS_COLLECTION: ${QDRANT_TRENDS_COLLECTION:-trend_clusters}
      QDRANT_TRENDS_COLLECTION_ALIAS: ${QDRANT_TRENDS_COLLECTION_ALIAS:-}
      QDRANT_FILTER_EMBEDDING_VERSION: ${QDRANT_FILTER_EMBEDDING_VERSION:-true}
      QDRANT_ENFORCE_COLLECTION_SCHEMA: ${QDRANT_ENFORCE_COLLECTION_SCHEMA:-true}
      # own_stake (задача B) — вторая ось карточки: косинус запроса к отдельному корпусу
      # автора. Считается на поиске (mcp/tools/search_frontier.py), поэтому это
      # единственный сервис, которому ручки нужны вообще (почему не worker — см. блок
      # worker). Коллекция отдельная, без workspace_id, payload-фильтр к ней не
      # применяется, hybrid_search и get_frontier_brief в неё не ходят. Имя должно
      # совпадать с тем, под которым корпус залит scripts/index_own_corpus.py.
      QDRANT_OWN_CORPUS_COLLECTION: ${QDRANT_OWN_CORPUS_COLLECTION:-own_corpus}
      # false по умолчанию: пока корпус не наполнен, own_stake шумный. Включение НЕ меняет
      # порядок выдачи — own_stake не входит в score, добавляются только ключи own_stake и
      # stake_quadrant. Если после включения порядок поехал — сломан инвариант, а не настройка.
      OWN_STAKE_ENABLED: ${OWN_STAKE_ENABLED:-false}
      OWN_STAKE_TOP_K: ${OWN_STAKE_TOP_K:-3}
      # Пороги квадрантов — ПЛЕЙСХОЛДЕРЫ. Взять их неоткуда: score на выдаче при включённом
      # sparse — RRF-балл, а не косинус, и между запросами он несопоставим. Настоящие
      # значения подбираются по накопленной разметке card_feedback (задача C, гейт — 60 пар
      # с обоими числами; list_card_feedback отдаёт axes_filled_total именно под этот счёт).
      # Обоснование каждой цифры — в .env.example и shared/config.py:44-54. Дефолты обязаны
      # совпадать с shared/config.py, иначе `docker run --env-file` и compose разложат одну
      # и ту же карточку по разным квадрантам.
      OWN_STAKE_HIGH: ${OWN_STAKE_HIGH:-0.60}
      RELEVANCE_HIGH: ${RELEVANCE_HIGH:-0.40}
      # Внешнее заземление выдачи: mcp/tools/search_frontier.py и search_balanced.py читают
      # searxng_enabled / searxng_categories / searxng_max_results напрямую и поднимают
      # SearXNGClient, который дочитывает searxng_url / searxng_timeout_seconds /
      # searxng_cache_ttl. До 2026-08-03 ни одной SEARXNG_* здесь не было: worker и admin
      # слушались .env, а mcp — дефолтов, запечённых в образ. Практический эффект —
      # SEARXNG_ENABLED=false останавливал внешние вызовы везде, кроме поиска, то есть
      # ровно там, где их больше всего. Дефолты обязаны совпадать с shared/config.py.
      SEARXNG_URL: http://searxng:8080
      SEARXNG_ENABLED: ${SEARXNG_ENABLED:-true}
      SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES:-general,news}
      SEARXNG_MAX_RESULTS: ${SEARXNG_MAX_RESULTS:-5}
      SEARXNG_TIMEOUT_SECONDS: ${SEARXNG_TIMEOUT_SECONDS:-8}
      SEARXNG_CACHE_TTL: ${SEARXNG_CACHE_TTL:-3600}
      # Инвалидатор кэша поиска: входит в материал ключа _cache_key. Пусто — кэш
      # не инвалидируется правкой searxng/settings.yml (см. .env.example).
      SEARXNG_ENGINES_FINGERPRINT: ${SEARXNG_ENGINES_FINGERPRINT:-}
      SEARXNG_EMPTY_CACHE_TTL: ${SEARXNG_EMPTY_CACHE_TTL:-120}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_BASE: http://gpt2giga-proxy:8090/v1
      GIGACHAT_PROXY_URL: http://gpt2giga-proxy:8090
      WORMSOFT_API_BASE: ${WORMSOFT_API_BASE:-https://ai.wormsoft.ru/api/gpt}
      WORMSOFT_API_KEY: ${WORMSOFT_API_KEY:-}
      WORMSOFT_MODEL_DEFAULT: ${WORMSOFT_MODEL_DEFAULT:-wormsoft/agent/medium}
      WORMSOFT_MODEL_MCP_SYNTHESIS: ${WORMSOFT_MODEL_MCP_SYNTHESIS:-wormsoft/agent/high}
      WORMSOFT_VISION_MODEL: ${WORMSOFT_VISION_MODEL:-wormsoft/vision/medium}
      WORMSOFT_MAX_SIMULTANEOUS_REQUESTS: ${WORMSOFT_MAX_SIMULTANEOUS_REQUESTS:-1}
      WORMSOFT_MIN_REQUEST_INTERVAL_MS: ${WORMSOFT_MIN_REQUEST_INTERVAL_MS:-2000}
      WORMSOFT_MAX_RETRIES: ${WORMSOFT_MAX_RETRIES:-0}
      WORMSOFT_SHARED_GUARD_ENABLED: ${WORMSOFT_SHARED_GUARD_ENABLED:-true}
      WORMSOFT_CREDIT_THROTTLE_ENABLED: ${WORMSOFT_CREDIT_THROTTLE_ENABLED:-false}
      WORMSOFT_CREDIT_WINDOW_LIMIT: ${WORMSOFT_CREDIT_WINDOW_LIMIT:-500000}
      WORMSOFT_CREDIT_WINDOW_SECONDS: ${WORMSOFT_CREDIT_WINDOW_SECONDS:-18000}
      GIGACHAT_EMBEDDINGS_MODEL: ${GIGACHAT_EMBEDDINGS_MODEL:-EmbeddingsGigaR}
      GIGACHAT_MODEL_LITE: ${GIGACHAT_MODEL_LITE:-GigaChat-2}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
      GIGACHAT_MODEL_PRO: ${GIGACHAT_MODEL_PRO:-GigaChat-2-Pro}
      GIGACHAT_MODEL_MAX: ${GIGACHAT_MODEL_MAX:-GigaChat-2-Max}
      GIGACHAT_MODEL_MCP_SYNTHESIS: ${GIGACHAT_MODEL_MCP_SYNTHESIS:-}
      GIGACHAT_SESSION_CACHE_ENABLED: ${GIGACHAT_SESSION_CACHE_ENABLED:-true}
      GIGACHAT_ESCALATION_ENABLED: ${GIGACHAT_ESCALATION_ENABLED:-true}
      GIGACHAT_TOKEN_BUDGET_EMBED: ${GIGACHAT_TOKEN_BUDGET_EMBED:-1200}
      EMBED_DIM: ${EMBED_DIM:-2560}
      MCP_PORT: 8100
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # 127.0.0.1, а не 0.0.0.0. У mcp/server.py НЕТ аутентификации: ни HTTPBasic, ни
      # Depends, ни api_key. Пока на нём жили только читающие инструменты, открытый
      # LAN-порт был терпим; 03.08.2026 сюда добавились record_card_feedback (пишет в
      # Postgres) и list_card_feedback (отдаёт разметку) — неаутентифицированный POST
      # на 8100 возвращал 200 с содержимым таблицы, проверено. ТЗ это прямо запрещало
      # («не поднимать HTTP-эндпоинт записи на MCP, пока 8100 открыт на 0.0.0.0 без
      # аутентификации») и одновременно предписывало сами инструменты — противоречие
      # разрешаем закрытием порта, а не отказом от инструментов.
      # Шлюз не страдает: он ходит по docker-сети (MCP_REST_BASE=http://mcp:8100),
      # хостовая публикация ему не нужна. Диагностика с сервера через 127.0.0.1 тоже
      # продолжает работать. Открывать обратно — только вместе с аутентификацией.
      - "127.0.0.1:8100:8100"
    depends_on:
      postgres:
        condition: service_started
      qdrant:
        condition: service_started
      gpt2giga-proxy:
        condition: service_started
    logging: *docker-json-logging
    restart: unless-stopped
    volumes:
      - fastembed_cache:/cache
    networks: [frontier-net]

  # ── MCP GATEWAY (SSE транспорт для Claude Code / Cursor) ────────────────────

  mcp-gateway:
    build:
      context: .
      dockerfile: mcp/Dockerfile.gateway
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    profiles: [mcp]
    environment:
      MCP_GATEWAY_HOST: "0.0.0.0"
      MCP_GATEWAY_PORT: "8102"
      MCP_REST_BASE: "http://mcp:8100"
    ports:
      - "8102:8102"
    depends_on:
      - mcp
    # curl в образе нет (Dockerfile.gateway ставит только httpx, mcp и
    # prometheus-client), поэтому проверяем питоном из того же образа.
    # /healthz намеренно не ходит в REST: healthcheck отвечает на вопрос «жив ли
    # этот процесс», а не «жив ли весь стек» — иначе падение mcp:8100
    # перезапускало бы шлюз по кругу, ничего этим не исправляя.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8102/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  # ── ADMIN ────────────────────────────────────────────────────────────────────

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    profiles: [admin]
    environment:
      FRONTIER_RUNTIME_MODE: ${FRONTIER_RUNTIME_MODE:-custom}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-frontier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-frontier}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      # Должны совпадать с worker/mcp: иначе admin-кластеризация читает пустую базовую коллекцию вместо алиаса.
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-frontier_docs}
      QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:-}
      QDRANT_TRENDS_COLLECTION: ${QDRANT_TRENDS_COLLECTION:-trend_clusters}
      QDRANT_TRENDS_COLLECTION_ALIAS: ${QDRANT_TRENDS_COLLECTION_ALIAS:-}
      QDRANT_FILTER_EMBEDDING_VERSION: ${QDRANT_FILTER_EMBEDDING_VERSION:-true}
      QDRANT_ENFORCE_COLLECTION_SCHEMA: ${QDRANT_ENFORCE_COLLECTION_SCHEMA:-true}
      # admin запускает кластеризацию/signal-analysis/missing-signals — нужен тот же embedding/proxy/поиск, что у worker.
      EMBED_DIM: ${EMBED_DIM:-2560}
      GIGACHAT_EMBEDDINGS_MODEL: ${GIGACHAT_EMBEDDINGS_MODEL:-EmbeddingsGigaR}
      OPENAI_API_BASE: http://gpt2giga-proxy:8090/v1
      GIGACHAT_PROXY_URL: http://gpt2giga-proxy:8090
      SEARXNG_URL: http://searxng:8080
      # Единственный сервис, который реально крутит gap-анализ: scheduler зовёт
      # run_missing_signals / run_semantic_clusters через `python -m
      # admin.backend.manual_jobs` в дочернем процессе, а тот наследует именно это
      # окружение. До 2026-08-03 ни одной MISSING_SIGNALS_* здесь не было (проверено
      # docker inspect на живом контейнере): пороги были задокументированы в
      # .env.example как операторские ручки, но правка .env не меняла ничего —
      # значения брались из дефолтов, запечённых в образ, и «перетюнить» их можно
      # было только пересборкой. Дефолты обязаны совпадать с shared/config.py.
      SEARXNG_ENABLED: ${SEARXNG_ENABLED:-true}
      SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES:-general,news}
      SEARXNG_MAX_RESULTS: ${SEARXNG_MAX_RESULTS:-5}
      SEARXNG_TIMEOUT_SECONDS: ${SEARXNG_TIMEOUT_SECONDS:-8}
      SEARXNG_CACHE_TTL: ${SEARXNG_CACHE_TTL:-3600}
      # Инвалидатор кэша поиска: входит в материал ключа _cache_key. Пусто — кэш
      # не инвалидируется правкой searxng/settings.yml (см. .env.example).
      SEARXNG_ENGINES_FINGERPRINT: ${SEARXNG_ENGINES_FINGERPRINT:-}
      SEARXNG_EMPTY_CACHE_TTL: ${SEARXNG_EMPTY_CACHE_TTL:-120}
      MISSING_SIGNALS_ENABLED: ${MISSING_SIGNALS_ENABLED:-true}
      MISSING_SIGNALS_TOPIC_LIMIT: ${MISSING_SIGNALS_TOPIC_LIMIT:-8}
      MISSING_SIGNALS_MIN_GAP_SCORE: ${MISSING_SIGNALS_MIN_GAP_SCORE:-0.33}
      MISSING_SIGNALS_PRESENCE_SATURATION: ${MISSING_SIGNALS_PRESENCE_SATURATION:-0.30}
      MISSING_SIGNALS_MIN_EXTERNAL_RESULTS: ${MISSING_SIGNALS_MIN_EXTERNAL_RESULTS:-2}
      MISSING_SIGNALS_MAX_EVIDENCE_URLS: ${MISSING_SIGNALS_MAX_EVIDENCE_URLS:-5}
      MISSING_SIGNALS_TIME_RANGE: ${MISSING_SIGNALS_TIME_RANGE:-month}
      MISSING_SIGNALS_LANGUAGE: ${MISSING_SIGNALS_LANGUAGE:-auto}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-ru-central-1}
      PADDLEOCR_URL: ${PADDLEOCR_URL:-}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS}
      WORMSOFT_API_BASE: ${WORMSOFT_API_BASE:-https://ai.wormsoft.ru/api/gpt}
      WORMSOFT_API_KEY: ${WORMSOFT_API_KEY:-}
      WORMSOFT_MODEL_DEFAULT: ${WORMSOFT_MODEL_DEFAULT:-wormsoft/agent/medium}
      WORMSOFT_MODEL_MCP_SYNTHESIS: ${WORMSOFT_MODEL_MCP_SYNTHESIS:-wormsoft/agent/high}
      WORMSOFT_VISION_MODEL: ${WORMSOFT_VISION_MODEL:-wormsoft/vision/medium}
      WORMSOFT_MAX_SIMULTANEOUS_REQUESTS: ${WORMSOFT_MAX_SIMULTANEOUS_REQUESTS:-1}
      WORMSOFT_MIN_REQUEST_INTERVAL_MS: ${WORMSOFT_MIN_REQUEST_INTERVAL_MS:-2000}
      WORMSOFT_MAX_RETRIES: ${WORMSOFT_MAX_RETRIES:-0}
      WORMSOFT_SHARED_GUARD_ENABLED: ${WORMSOFT_SHARED_GUARD_ENABLED:-true}
      WORMSOFT_CREDIT_THROTTLE_ENABLED: ${WORMSOFT_CREDIT_THROTTLE_ENABLED:-false}
      WORMSOFT_CREDIT_WINDOW_LIMIT: ${WORMSOFT_CREDIT_WINDOW_LIMIT:-500000}
      WORMSOFT_CREDIT_WINDOW_SECONDS: ${WORMSOFT_CREDIT_WINDOW_SECONDS:-18000}
