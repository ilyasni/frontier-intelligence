      ADMIN_OPENROUTER_CATALOG_REFRESH_CRON: ${ADMIN_OPENROUTER_CATALOG_REFRESH_CRON:-*/15 * * * *}
      ADMIN_OPENROUTER_KEY_REFRESH_CRON: ${ADMIN_OPENROUTER_KEY_REFRESH_CRON:-*/5 * * * *}
      ADMIN_OPENROUTER_HEALTH_REFRESH_CRON: ${ADMIN_OPENROUTER_HEALTH_REFRESH_CRON:-*/5 * * * *}
      ADMIN_OPENROUTER_RECONCILE_CRON: ${ADMIN_OPENROUTER_RECONCILE_CRON:-* * * * *}
      # Ночная кластеризация вынесена из окна бэкапа (тот стартует в 03:30
      # и держит три ядра вместе с выгрузкой в S3). Замер 2026-08-05:
      # disruption занимал 552с из 900, стартуя в 03:35 — то есть внутри окна.
      ADMIN_SEMANTIC_CLUSTER_CRON: ${ADMIN_SEMANTIC_CLUSTER_CRON:-0 5 * * *}
      # Потолок на дочерний процесс джоба. Дефолт 900с был выбран при
      # длительности 37с; после подъёма потолка выборки disruption до 2000
      # прогон занимает 552с, а рост квадратичен по матрице попарных
      # косинусов — раскат источников на disruption вывел бы его за 900.
      # Превышение НЕ деградирует: SIGTERM, через 5с SIGKILL, и воркспейс
      # остаётся без кластеризации до следующих суток, молча.
      ADMIN_JOB_SUBPROCESS_TIMEOUT_SEC: ${ADMIN_JOB_SUBPROCESS_TIMEOUT_SEC:-1800}
      ADMIN_TREND_ALERT_CRON: ${ADMIN_TREND_ALERT_CRON:-25 * * * *}
      TREND_ALERTS_ENABLED: ${TREND_ALERTS_ENABLED:-true}
      TREND_ALERT_WINDOW_HOURS: ${TREND_ALERT_WINDOW_HOURS:-48}
      TREND_ALERT_MIN_SIGNAL_SCORE: ${TREND_ALERT_MIN_SIGNAL_SCORE:-0.80}
      TREND_ALERT_CHANGE_POINT_MIN_SIGNAL_SCORE: ${TREND_ALERT_CHANGE_POINT_MIN_SIGNAL_SCORE:-0.74}
      TREND_ALERT_MIN_CHANGE_POINT_STRENGTH: ${TREND_ALERT_MIN_CHANGE_POINT_STRENGTH:-0.70}
      TREND_ALERT_MIN_DOC_COUNT: ${TREND_ALERT_MIN_DOC_COUNT:-5}
      TREND_ALERT_MIN_SOURCE_COUNT: ${TREND_ALERT_MIN_SOURCE_COUNT:-3}
      TREND_ALERT_MAX_PER_RUN: ${TREND_ALERT_MAX_PER_RUN:-2}
      TREND_ALERT_MAX_PER_7D: ${TREND_ALERT_MAX_PER_7D:-2}
      ADMIN_PORT: 8101
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set a strong ADMIN_PASSWORD in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8101:8101"
    volumes:
      - ${FRONTIER_RUNTIME_DIR:-/opt/frontier-intelligence/runtime}:/runtime
      # Статика админки монтируется с хоста — правки фронта применяются мгновенно
      # (FastAPI StaticFiles/FileResponse читают с диска), без пересборки образа.
      - ./admin/frontend:/app/admin/frontend:ro
    # admin шеллит тяжёлые pipeline-джобы (clustering/signal-analysis/...) в субпроцессы
    # через `python -m admin.backend.manual_jobs`. Два CPU-heavy clustering-джоба делят
    # _cluster_lock и не пересекаются, остальное I/O-bound (LLM/Neo4j) — но без cgroup-лимита
    # неожиданный оверлап мог бы задушить co-located mcp/postgres/neo4j на том же хосте.
    # Хост — 3 ядра / 22Gi, поэтому cpus=1.5 (половина хоста): квота ограничивает суммарное
    # потребление вне зависимости от числа BLAS/numpy-потоков в субпроцессе и оставляет
    # ≥1.5 ядра стеку.
    # memory: 4g (у worker 2g) — signal_analysis для workspace=disruption материализует
    # ~23k строк emerging_signals и стабильно ловил memcg-OOM на 2g: cgroup oom_kill рос
    # каждые 8ч при RestartCount=0 и health 200, т.е. падение было полностью бесшумным.
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "1.5"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      xray:
        condition: service_started
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  # ── CRAWL ────────────────────────────────────────────────────────────────────

  crawl4ai:
    build:
      context: .
      dockerfile: crawl4ai/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    profiles: [crawl]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-frontier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-frontier}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-ru-central-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      xray:
        condition: service_started
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  # ── SEARXNG ──────────────────────────────────────────────────────────────────

  searxng:
    image: searxng/searxng:latest
    profiles: [searxng, worker]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/healthz 2>/dev/null || curl -sf http://127.0.0.1:8080/healthz >/dev/null 2>&1 || python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  # ── MONITOR ──────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    profiles: [monitor]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=200h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  alertmanager:
    image: prom/alertmanager:latest
    profiles: [monitor]
    entrypoint:
      - /bin/sh
      - -lc
      - |
        # Плейсхолдеры подставляются здесь, а не хранятся в репозитории.
        # Все три значения sed-безопасны по составу символов: токен вебхука —
        # base64 без /+=, токен бота — алфавит с двоеточием, chat_id — цифры.
        # URL прокси сюда НЕ подставляется: в нём учётные данные, и '&' в пароле
        # молча испортил бы замену. Он уезжает в HTTPS_PROXY, см. environment.
        sed -e "s#__ALERTMANAGER_WEBHOOK_TOKEN__#$${ALERTMANAGER_WEBHOOK_TOKEN}#g" \
            -e "s#__TELEGRAM_BOT_TOKEN__#$${TELEGRAM_BOT_TOKEN}#g" \
            -e "s#__ALERT_TELEGRAM_CHAT_NUMERIC_ID__#$${ALERT_TELEGRAM_CHAT_NUMERIC_ID}#g" \
          /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager
    environment:
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-}
      # Прямой путь доставки в Telegram, минуя admin (receiver telegram-direct).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Числовой id канала: Alertmanager принимает chat_id только как int64.
      # В ALERT_TELEGRAM_CHAT_ID лежит @имя — оно годится для Bot API в admin,
      # но не для этого конфига. Получить числовой: getChat?chat_id=@имя.
      ALERT_TELEGRAM_CHAT_NUMERIC_ID: ${ALERT_TELEGRAM_CHAT_NUMERIC_ID:-}
      # Прямого egress к api.telegram.org с хоста нет — только socks5.
      # Читается через http_config.proxy_from_environment у telegram-direct.
      HTTPS_PROXY: ${TELEGRAM_ALERT_PROXY_URL:-}
      # Внутрисетевые адреса мимо прокси: вебхук в admin и собственный API.
      NO_PROXY: admin,prometheus,localhost,127.0.0.1
    command:
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    # depends_on намеренно снят: alertmanager существует, чтобы сообщать о
    # падении admin, и не должен ждать его старта. Порядок запуска здесь
    # ничего не гарантирует — вебхук ретраится сам.
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: [monitor]
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($|/)
      # Textfile-коллектор: метрики, которые некому экспортировать из приложения.
      # Пишет scripts/export-analysis-freshness.sh по cron — см. FrontierAnalysisStale.
      # Нужен потому, что провал clustering/signal-analysis логируется как успех
      # (error-хендлер падает в аборченной транзакции), и алертить надо по результату
      # в данных, а не по статусу джоба.
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ./prometheus/textfile:/var/lib/node_exporter/textfile:ro
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

  grafana:
    image: grafana/grafana:latest
    profiles: [monitor]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set a strong GRAFANA_PASSWORD in .env}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    logging: *docker-json-logging
    restart: unless-stopped
    networks: [frontier-net]

volumes:
  postgres_data:
  redis_data:
  paddleocr_models:
  fastembed_cache:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  frontier-net:
    driver: bridge
