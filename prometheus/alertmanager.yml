global:
  resolve_timeout: 5m

# Маршрутизация.
#
# Штатный путь доставки — вебхук в admin, который форматирует сообщение и публикует
# его в ntfy. Он остаётся основным: у него дедуп и человеческий формат.
#
# Проблема, ради которой появился второй путь: цепочка Prometheus -> Alertmanager -> admin
# -> ntfy завязана на тот самый сервис, о падении которого надо сообщать. Замер за
# 7 дней до правки: 135 провалов доставки из 296 (46%), и все они пришлись на окно, когда
# admin лежал. То есть в момент аварии не доходило вообще ничего, включая FrontierAdminDown.
#
# Поэтому критические правила дублируются receiver'ом ntfy-direct, который ходит
# в ntfy сам, минуя admin. У него отдельный bearer credential: отказ или компрометация
# app credential не затрагивает независимый аварийный путь.
#
# Цена решения: на критический алерт приходит два сообщения. Это сознательно —
# критические правила редки по построению, и потерять их дороже, чем получить дважды.
# Точное число намеренно не названо: на 04.08.2026 их было 11 из 56, к вечеру того же
# дня — 13 из 65, и зафиксированная в комментарии цифра устаревает быстрее, чем
# кто-либо станет её править. Актуальное:
#   curl -sS 127.0.0.1:9090/api/v1/rules | grep -c '"severity":"critical"'
route:
  receiver: ntfy-admin
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 10m
  repeat_interval: 6h
  routes:
    # FrontierWatchdog firing ВСЕГДА, по построению (expr: vector(1)).
    # Доставлять его нельзя — он существует затем, чтобы его ОТСУТСТВИЕ было заметно
    # снаружи: scripts/alert-watchdog.sh читает его через /api/v2/alerts и поднимает
    # тревогу, если алерт пропал или протух. Правило стоит первым и глушится.
    - receiver: blackhole
      matchers:
        - alertname="FrontierWatchdog"

    # Явный opt-out для заведомо шумных правил: пометь их label notify="never".
    - receiver: blackhole
      matchers:
        - notify="never"

    # Критические — дублируем прямым путём и продолжаем обход, чтобы штатный
    # путь через admin тоже отработал.
    - receiver: ntfy-direct
      matchers:
        - severity="critical"
      continue: true

    # Catch-all. Нужен явно: если бы его не было, критический алерт, совпавший
    # с правилом выше, ушёл бы ТОЛЬКО прямым путём — receiver родительского
    # маршрута не применяется, когда сработал хоть один дочерний.
    - receiver: ntfy-admin

receivers:
  - name: blackhole

  - name: ntfy-admin
    webhook_configs:
      - url: 'http://admin:8101/api/monitoring/alertmanager/webhook'
        send_resolved: true
        max_alerts: 10
        # Дождаться трёх попыток ntfy по 15s и backoff 2s/4s в admin webhook.
        timeout: 60s
        # Токен уехал из query string в Basic-auth: uvicorn логирует полный путь
        # запроса, поэтому раньше секрет ложился открытым текстом в docker-логи admin
        # (ротация логов на демоне не настроена). Обработчик принимает оба способа —
        # admin/backend/routers/monitoring.py:_assert_alertmanager_token.
        http_config:
          basic_auth:
            username: alertmanager
            password: __ALERTMANAGER_WEBHOOK_TOKEN__

  - name: ntfy-direct
    webhook_configs:
      - url: '__NTFY_URL__?template=netwatch'
        send_resolved: true
        max_alerts: 3
        timeout: 15s
        http_config:
          follow_redirects: false
          authorization:
            type: Bearer
            credentials_file: /run/secrets/ntfy-alertmanager
