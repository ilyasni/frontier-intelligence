global:
  resolve_timeout: 5m

route:
  # По умолчанию все алерты уходят в Telegram (раньше был blackhole → MCP-down и др. молчали).
  receiver: telegram-admin
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 10m
  repeat_interval: 6h
  routes:
    # Явный opt-out для заведомо шумных правил: пометь их label notify="never".
    - receiver: blackhole
      matchers:
        - notify="never"

receivers:
  - name: blackhole
  - name: telegram-admin
    webhook_configs:
      - url: 'http://admin:8101/api/monitoring/alertmanager/webhook?token=__ALERTMANAGER_WEBHOOK_TOKEN__'
        send_resolved: true
        max_alerts: 10
