groups:
  # Собственные стадии конвейера и здоровье Redis-стримов (заход 8, 2026-08-05).
  #
  # До этой группы у конвейера не было ни одного счётчика СВОИХ стадий: статус
  # писался только в PostgreSQL, то есть состояние можно было посчитать задним
  # числом SQL-запросом, а потока не существовало. Поэтому 39% дропа по
  # релевантности, всплеск ошибок (29 из 32 за всю историю пришлись на одни
  # сутки) и 37 309 событий, вытесненных триммингом непрочитанными, были
  # невидимы одновременно — и обнаруживались только когда данные переставали
  # поступать вовсе, через 6-24 часа.
  - name: frontier_pipeline
    rules:
      # Порог абсолютный и намеренно грубый: ошибки индексации — редкое событие
      # (32 за всю историю до 04.08.2026), поэтому любой заметный всплеск важнее
      # точности. Регрессию доли дропа сюда НЕ ставим: базовая линия требует
      # окна длиннее ретенции Prometheus (200ч), см. пункт 42 реестра.
      - alert: FrontierPipelineErrorBurst
        expr: sum by (stage) (increase(frontier_pipeline_stage_total{outcome="error"}[1h])) >= 10
        for: 15m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Стадия {{ $labels.stage }} даёт ошибки пачками"
          description: "На стадии {{ $labels.stage }} за час накопилось {{ $value }} исходов outcome=error. Разрез по воркспейсам: sum by (workspace) (increase(frontier_pipeline_stage_total{stage=\"{{ $labels.stage }}\",outcome=\"error\"}[1h])). До появления этого счётчика такой всплеск не был виден ничем: статус стадии писался только в indexing_status, то есть существовал как состояние, но не как поток."

      # Тихая потеря на самом входе: xadd не удался, событие не попало в стрим,
      # след оставался только в логах ingest.
      - alert: FrontierIngestPublishFailing
        expr: sum by (workspace) (increase(frontier_pipeline_stage_total{stage="ingest",outcome="publish_failed"}[15m])) >= 5
        for: 10m
        labels:
          severity: warning
          service: ingest
          notify: telegram
        annotations:
          summary: "Публикация событий ingest не удаётся ({{ $labels.workspace }})"
          description: "За 15 минут {{ $value }} событий воркспейса {{ $labels.workspace }} не доехали до stream:posts:parsed. Чекпоинт при этом НЕ сдвигается (at-least-once), то есть следующий прогон перечитает окно — но если отказы продолжаются, источник стоит на месте. Проверь Redis и его память."

      # Джоб планировщика упал. При исключении дочерний процесс пишет JSON
      # в stderr и возвращает 1, поэтому перепубликовывать его метрики нечего —
      # без этого счётчика провал не оставлял в наблюдаемости вообще ничего.
      - alert: FrontierAdminJobFailing
        expr: sum by (job_name) (increase(frontier_admin_job_runs_total{outcome=~"failed|timeout"}[6h])) >= 3
        for: 15m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "Джоб {{ $labels.job_name }} падает повторно"
          description: "{{ $value }} неудачных прогонов {{ $labels.job_name }} за 6 часов. outcome=timeout означает превышение ADMIN_JOB_SUBPROCESS_TIMEOUT_SEC (1800с по умолчанию с 05.08.2026, коммит 7cf0b33) — ночная кластеризация disruption занимает 484-552с, то есть около 30% лимита. outcome=failed — ненулевой код возврата, расшифровку сигнала смотри в логах admin."

      # Правило выше ловит ТОЛЬКО всплеск и по построению слепо к суточным джобам:
      # порог «≥3 отказа за 6 часов» суточный прогон не наберёт никогда, даже падая
      # каждую ночь. Это не теория — так и вышло: `run_retrospective_review` падал
      # на workspace=disruption каждую ночь с 26.06.2026 по 06.08.2026 (дубликат
      # первичного ключа в threshold_proposals), ретро-петля порогов не выдала ни
      # одного предложения за 41 сутки, и ни один из 82 алертов этого не показал.
      #
      # Отсюда второе правило — на ПОВТОРЯЕМОСТЬ, а не на объём: отказ был вчера
      # и повторился сегодня. Разовый сбой (сеть, рестарт) даёт единицу за 49 часов
      # и не будит; постоянный дефект даёт двойку и будит на второй день.
      # Окно 49ч, а не 48: суточный крон плавает на минуты, ровно 48 отрезало бы
      # предыдущий прогон в половине случаев.
      - alert: FrontierAdminJobFailingDaily
        expr: sum by (job_name) (increase(frontier_admin_job_runs_total{outcome=~"failed|timeout"}[49h])) >= 2
        for: 30m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "Джоб {{ $labels.job_name }} падает не первый день"
          description: "{{ $value }} неудачных прогонов {{ $labels.job_name }} за двое суток — то есть отказ повторяется, а не случился однажды. Для суточных джобов (run_retrospective_review, run_novelty_judge, run_relevance_audit, run_semantic_clusters) это единственное правило, способное сработать: FrontierAdminJobFailing требует ≥3 отказов за 6 часов и суточный прогон столько не наберёт. Смотри `docker logs frontier-intelligence-admin-1 | grep 'failed for workspace'` — счётчик считает ПО ВОРКСПЕЙСАМ, поэтому падение одного из шести видно здесь и не видно по статусу самой задачи APScheduler."

      # Пункт 8 реестра. За сутки 1403 успеха против 1497 неуспехов, и все
      # неуспехи были тупиком: `enrich_url` возвращает None на девяти развилках,
      # вызывающий пишет log.warning и делает XACK. Отличить «у поста нечего
      # краулить» от «источник отдал 403» было нельзя ни из данных, ни из метрик.
      #
      # Порог на ДОЛЮ, а не на число: краул отказывает всегда — часть ссылок
      # мертва по природе, — и абсолютный порог означал бы либо вечное firing,
      # либо слепоту. Базовая доля отказов около 50%, поэтому 0.8 означает,
      # что сломалось что-то системное: прокси, сеть или сам браузерный движок.
      #
      # Второе условие — порог по ОБЪЁМУ, и он появился не из осторожности,
      # а по факту: сразу после раската счётчика правило встало в pending на
      # выборке из двенадцати событий (9 отказов 403, 2 успеха, 1 таймаут = 83%).
      # Доля на такой выборке не значит ничего, а при нормальном потоке около
      # 120 краулов в час — тем более. Правило без порога по объёму срабатывает
      # на первых же минутах после любого рестарта: ровно тот класс шума, ради
      # борьбы с которым заводился весь этот заход.
      - alert: FrontierCrawlFailureRateHigh
        expr: |
          (
            sum(rate(frontier_crawl_outcomes_total{outcome="failed"}[1h]))
            /
            clamp_min(sum(rate(frontier_crawl_outcomes_total[1h])), 0.001)
            > 0.8
          )
          and
          (sum(increase(frontier_crawl_outcomes_total[1h])) >= 30)
        for: 30m
        labels:
          severity: warning
          service: crawl4ai
          notify: telegram
        annotations:
          summary: "Краул отказывает в четырёх случаях из пяти"
          description: "Доля неуспешных краулов за час — {{ $value | humanizePercentage }} при обычных ~50%. Разбивка по причинам: sum by (reason) (rate(frontier_crawl_outcomes_total[1h])). Смотри в первую очередь reason=timeout и reason=browser_error: первое означает сеть или прокси, второе — движок браузера. reason=http_403 массово означает, что источники перестали пускать, и лечится прокси xray."

      # Пункт 12 реестра. Ключа DLQ в Redis нет вовсе, поэтому ноль печатается
      # экспортёром ЯВНО — иначе «poison не случался» и «DLQ не наблюдается»
      # были бы одним и тем же пустым местом.
      - alert: FrontierDlqNotEmpty
        expr: max by (stream) (frontier_redis_dlq_length) > 0
        for: 10m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "В DLQ {{ $labels.stream }} лежат сообщения"
          description: "{{ $value }} poison-сообщений в {{ $labels.stream }}. Механизм «сохранить и разобрать позже» существовал только в половине «сохранить»: консьюмера у DLQ нет, разбирать надо руками — XRANGE {{ $labels.stream }} - + COUNT 10 и смотреть поле error."

      # Пункт 9 реестра: продюсер, пишущий в стрим, который никто не читает.
      # lag и pending этого не показывают — групп нет, отставать нечему.
      # `increase()`/`delta()` здесь НЕ годятся, хотя просятся: обе функции
      # экстраполируют на края окна и дают небольшое ненулевое значение даже
      # когда серия стоит на месте — проверено на живых данных сразу после того,
      # как продюсера сняли (2.03 «прироста» при полностью замершем счётчике).
      # То есть правило продолжало бы считать стрим растущим ещё долго после
      # починки. Сравнение max и min по окну точное и экстраполяции не знает.
      - alert: FrontierRedisStreamOrphanProducer
        expr: (max by (stream) (frontier_redis_stream_groups) == 0) and (max_over_time(frontier_redis_stream_entries_added[1h]) > min_over_time(frontier_redis_stream_entries_added[1h]))
        for: 30m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "В стрим {{ $labels.stream }} пишут, но его никто не читает"
          description: "У {{ $labels.stream }} ноль consumer-групп, при этом за час прибавилось {{ $value }} записей. Они будут вытеснены триммингом непрочитанными, и ни lag, ни pending этого не покажут. Либо подключить потребителя, либо снять продюсера — группа без потребителя проблему не решает, а лишь меняет её форму на растущий pending."

      # Пункт 39 реестра: MAXLEN режет по длине, не спрашивая, прочитано ли.
      - alert: FrontierRedisStreamDeliveryGap
        expr: max by (stream, group) (frontier_redis_stream_delivery_gap) > 0
        for: 10m
        labels:
          severity: critical
          service: worker
          notify: telegram
        annotations:
          summary: "Тримминг съел недоставленное: {{ $labels.stream }}/{{ $labels.group }}"
          description: "last-delivered-id группы {{ $labels.group }} старше первой уцелевшей записи {{ $labels.stream }}: MAXLEN срезал сообщения ДО того, как их прочитали. Они потеряны безвозвратно. lag и pending при этом нулевые — отстающих записей больше не существует, ровно та тишина, что сопровождала Redis-OOM 31.07.2026. Смотри, не встал ли потребитель, и подними STREAM_MAXLEN, если поток вырос."

  # Хранилища (заход 8, пункт 14 реестра). До 2026-08-05 ни Redis, ни PostgreSQL,
  # ни Neo4j не скрейпились вообще: отказ хранилища был виден только по вторичным
  # признакам через 6-24 часа. Redis-OOM 31.07.2026 положил ingest, обогащение и
  # поиск на 9 часов при НУЛЕВЫХ lag и pending — писать в стрим было уже нечем,
  # поэтому все существовавшие правила промолчали.
  #
  # Значения снимает scripts/export-storage-metrics.sh в textfile-коллектор:
  # экспортёры-контейнеры не притащить (Docker Hub с хоста недоступен), а
  # self-metrics нет ни у одного из трёх образов.
  - name: frontier_storage
    rules:
      # То самое, чего не хватало 31.07. Порог 0.8 при maxmemory 2 GiB и текущем
      # потреблении ~0.29 GiB (14%) — запас шестикратный, ложных срабатываний не ждём.
      # Условие maxmemory > 0 обязательно: ноль означает «лимит не задан», и без
      # проверки деление дало бы +Inf на каждом скрейпе.
      - alert: FrontierRedisMemoryHigh
        expr: frontier_redis_maxmemory_bytes > 0 and (frontier_redis_used_memory_bytes / frontier_redis_maxmemory_bytes) > 0.8
        for: 10m
        labels:
          severity: warning
          service: redis
          notify: telegram
        annotations:
          summary: "Redis занял больше 80% своего потолка"
          description: "Использовано {{ $value | humanizePercentage }} от maxmemory. Именно это состояние 31.07.2026 положило стек на 9 часов, и заметить его было нечем: при упёршемся в потолок Redis lag и pending остаются нулевыми. Смотри длину стримов (XLEN) и кэш эмбеддингов; STREAM_MAXLEN=10000 уже стоит."

      # Политика вытеснения volatile-ttl: Redis выбрасывает ключи с TTL, то есть
      # первым страдает кэш эмбеддингов — молча и с деградацией скорости, а не
      # с ошибкой. Любое ненулевое вытеснение стоит увидеть.
      - alert: FrontierRedisEvictingKeys
        expr: increase(frontier_redis_evicted_keys_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: redis
          notify: telegram
        annotations:
          summary: "Redis вытесняет ключи"
          description: "За 15 минут вытеснено {{ $value }} ключей. Политика volatile-ttl бьёт по ключам с TTL, то есть по кэшу эмбеддингов: работа продолжится, но подорожает и замедлится, без единой ошибки в логах."

      - alert: FrontierRedisBgsaveFailing
        expr: frontier_redis_up == 1 and frontier_redis_rdb_last_bgsave_ok == 0
        for: 30m
        labels:
          severity: warning
          service: redis
          notify: telegram
        annotations:
          summary: "Последний bgsave Redis завершился ошибкой"
          description: "rdb_last_bgsave_status != ok. Снимок на диск не создаётся, значит перезапуск Redis потеряет состояние стримов и кэш. Обычная причина — нет места на диске или не хватает памяти на fork."

      # max_connections = 100 (проверено), сейчас занято ~12. 80 — это отказ
      # в обслуживании на пороге, а не абстрактный процент.
      - alert: FrontierPostgresConnectionsHigh
        expr: frontier_pg_numbackends > 80
        for: 10m
        labels:
          severity: warning
          service: postgres
          notify: telegram
        annotations:
          summary: "PostgreSQL близок к лимиту подключений"
          description: "{{ $value }} подключений при max_connections=100. Дальше новые соединения получают отказ, и первым ляжет тот сервис, который переподключается чаще прочих. Ищи утечку пула."

      - alert: FrontierPostgresLongRunningQuery
        expr: frontier_pg_longest_query_seconds > 900
        for: 10m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Клиентский запрос выполняется дольше 15 минут"
          description: "Самый долгий активный запрос идёт {{ $value | humanizeDuration }}. Autovacuum и служебные бэкенды из подсчёта исключены, то есть это наш код. Долгий запрос держит снапшот и мешает вакууму."

      - alert: FrontierNeo4jDown
        expr: frontier_neo4j_up == 0
        for: 30m
        labels:
          severity: warning
          service: neo4j
          notify: telegram
        annotations:
          summary: "Neo4j не отвечает на опрос"
          description: "cypher-shell не вернул счётчики графа. Значения frontier_neo4j_node_count и _relationship_count при этом остаются последними известными — насколько они устарели, показывает frontier_neo4j_measured_timestamp_seconds."

      # Опрос конкретного хранилища не удался, но экспортёр жив. Отличается от
      # правила ниже: там молчит сам экспортёр, здесь — конкретная база.
      - alert: FrontierStorageProbeFailing
        expr: min(frontier_redis_up) == 0 or min(frontier_pg_up) == 0
        for: 15m
        labels:
          severity: critical
          service: monitoring
          notify: telegram
        annotations:
          summary: "Экспортёр не может опросить Redis или PostgreSQL"
          description: "Признак живости одного из двух ключевых хранилищ равен нулю дольше 15 минут. Либо база не отвечает, либо `docker exec` из-под cron-пользователя перестал работать — проверь обе версии, вторая тихая."

      # Страховка от тихой смерти самого экспортёра: без неё все правила выше
      # замолчат разом, не зафиксировав ни одного отказа. Тот же приём, что у
      # FrontierAnalysisFreshnessExporterDown и FrontierBackupMetricsExporterDown.
      - alert: FrontierStorageMetricsExporterDown
        expr: absent(frontier_redis_up)
        for: 30m
        labels:
          severity: warning
          service: monitoring
          notify: telegram
        annotations:
          summary: "Экспортёр метрик хранилищ молчит"
          description: "Серия frontier_redis_up отсутствует >30м, значит вся группа frontier_storage сейчас не может сработать в принципе. Проверь cron scripts/export-storage-metrics.sh, каталог prometheus/textfile и флаг --collector.textfile.directory у node-exporter."

  - name: frontier_runtime_resilience
    rules:
      - alert: FrontierTelegramClientResetBurst
        expr: increase(frontier_telegram_client_resets_total[10m]) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Telegram ingest is repeatedly resetting clients"
          description: "Telegram client resets increased by {{ $value }} in the last 10 minutes. Check ingest logs and proxy/Telethon stability."

      - alert: FrontierCrawlSessionRecreateBurst
        expr: increase(frontier_crawl_session_recreates_total[10m]) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "crawl4ai is repeatedly recreating HTTP sessions"
          description: "crawl4ai session recreations increased by {{ $value }} in the last 10 minutes. Check crawl network health and upstream errors."

      - alert: FrontierRateLimitBurst
        expr: sum by (service, upstream, operation) (increase(frontier_rate_limit_events_total[10m])) >= 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Frontier is hitting upstream rate limits"
          description: "Rate-limit events for {{ $labels.service }}/{{ $labels.upstream }}/{{ $labels.operation }} increased by {{ $value }} in the last 10 minutes."

      - alert: FrontierWormsoftRateLimitBurst
        expr: sum by (service, operation) (increase(frontier_rate_limit_events_total{upstream="wormsoft"}[10m])) >= 3
        for: 5m
        labels:
          severity: critical
          service: worker
          notify: telegram
        annotations:
          summary: "Wormsoft is rate-limiting production traffic"
          description: "Wormsoft 429 events for {{ $labels.service }}/{{ $labels.operation }} increased by {{ $value }} in the last 10 minutes. The router may spill text tasks back to Giga and raise monthly cost."

      - alert: FrontierGigaChatBalanceLow
        expr: frontier_gigachat_balance_tokens{service="admin"} < 100000
        for: 5m
        labels:
          severity: critical
          service: admin
          notify: telegram
        annotations:
          summary: "GigaChat token balance is below 100k"
          description: "Remaining {{ $labels.usage }} balance is {{ $value }} tokens. Top up package tokens to avoid 402 Payment Required and false dropped posts."

      - alert: FrontierGigaChatBalanceRefreshStale
        expr: time() - frontier_gigachat_balance_refresh_timestamp_seconds{service="admin"} > 1800
        for: 10m
        labels:
          severity: critical
          service: admin
          notify: telegram
        annotations:
          summary: "GigaChat balance refresh is stale"
          description: "Admin has not refreshed GigaChat balance metrics for more than 30 minutes. Check scheduler health, OAuth, proxy, and GigaChat API reachability."

      - alert: FrontierWormsoftLimitsRefreshStale
        expr: time() - frontier_wormsoft_limits_refresh_timestamp_seconds{service="admin"} > 3600
        for: 10m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "Wormsoft limits refresh is stale"
          description: "Admin has not refreshed Wormsoft limits/pricing metrics for more than 60 minutes. Settings may still render from cache, but live routing cost visibility is degraded."

      - alert: FrontierWormsoftLimitsUnavailable
        expr: frontier_wormsoft_limits_available{service="admin"} == 0
        for: 15m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "Wormsoft limits snapshot is unavailable"
          description: "Admin could not fetch Wormsoft limits/pricing for more than 15 minutes. Check DNS, outbound access, API key validity, and Wormsoft control endpoints."

      - alert: FrontierWormsoftFallbackBurst
        expr: sum by (service, task, reason) (increase(frontier_llm_fallbacks_total{from_provider="wormsoft",reason=~"API.*|model_not_found|provider_unavailable"}[15m])) >= 3
        for: 5m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Wormsoft fallback traffic is spiking"
          description: "Wormsoft provider fallbacks for {{ $labels.service }}/{{ $labels.task }} (reason={{ $labels.reason }}) increased by {{ $value }} in 15 minutes. Check Wormsoft availability, timeout profile, or model routing."

      - alert: FrontierWormsoftChainEscalationBurst
        expr: |
          (
            sum by (service, task) (increase(frontier_llm_fallbacks_total{from_provider="wormsoft",reason="chain_escalation"}[1h]))
            /
            clamp_min(
              sum by (service, task) (increase(frontier_llm_requests_total{service="worker",provider="wormsoft",status="ok"}[1h])),
              1
            )
          ) >= 0.30
          and
          sum by (service, task) (increase(frontier_llm_fallbacks_total{from_provider="wormsoft",reason="chain_escalation"}[1h])) >= 30
        for: 15m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Wormsoft relevance gray-zone escalations are spiking"
          description: "Quality escalations from Wormsoft for {{ $labels.service }}/{{ $labels.task }} exceeded 30% with at least 30 events in 1 hour and persisted for 15 minutes. This usually means sustained gray-zone or ambiguous relevance cases and can materially raise Giga spend."

      - alert: FrontierWormsoftLocalThrottleBurst
        expr: sum by (service, reason) (increase(frontier_llm_throttle_events_total{service="worker",provider="wormsoft"}[15m])) >= 20
        for: 10m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Wormsoft local throttle events are spiking"
          description: "Local throttle events for Wormsoft (reason={{ $labels.reason }}) increased by {{ $value }} in 15 minutes. Check pacing, guard settings, and credit-window caps."

      - alert: FrontierProviderOutageFallbackBurst
        expr: sum by (service, from_provider, task, reason) (increase(frontier_llm_fallbacks_total{service="worker",reason=~"provider_unavailable|upstream_5xx|timeout|connection"}[15m])) >= 10
        for: 10m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Provider outage fallback burst is rising"
          description: "Fallbacks likely caused by provider outage for {{ $labels.from_provider }}/{{ $labels.task }} (reason={{ $labels.reason }}) increased by {{ $value }} in 15 minutes. Validate upstream health before changing local throttle settings."

      - alert: FrontierLocalThrottleVsOutageMismatch
        expr: |
          (
            sum by (service) (increase(frontier_llm_throttle_events_total{service="worker"}[15m]))
            /
            clamp_min(sum by (service) (increase(frontier_llm_fallbacks_total{service="worker",reason=~"provider_unavailable|upstream_5xx"}[15m])), 1)
          ) >= 5
        for: 10m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Local throttle dominates outage-like fallback profile"
          description: "Throttle events are much higher than outage-like fallback events for {{ $labels.service }}. Re-check classification (`throttled_local` vs upstream outage), pacing, and circuit policy."

      - alert: FrontierOpenRouterRateLimitBurst
        expr: sum by (service, operation) (increase(frontier_rate_limit_events_total{upstream="openrouter"}[10m])) >= 3
        for: 5m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "OpenRouter is rate-limiting production traffic"
          description: "OpenRouter 429 events for {{ $labels.service }}/{{ $labels.operation }} increased by {{ $value }} in the last 10 minutes. Dynamic OR fallback will spill to Polza or Giga and can raise cost."

      - alert: FrontierOpenRouterCreditLow
        expr: frontier_openrouter_credit_balance{service="admin"} < 5
        for: 10m
        labels:
          severity: info
          service: admin
        annotations:
          summary: "OpenRouter account credit balance is low"
          description: "OpenRouter account balance is only ${{ $value }} (total_credits - total_usage from /credits). Paid fallback headroom is limited. NB: this is the account balance, not the key's limit_remaining, which is null/0 for an uncapped key."

      - alert: FrontierOpenRouterKeyRefreshStale
        expr: time() - frontier_openrouter_key_refresh_timestamp_seconds{service="admin"} > 1800
        for: 10m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "OpenRouter key refresh is stale"
          description: "Admin has not refreshed OpenRouter key usage/limits for more than 30 minutes. Cost visibility and cap detection are degraded."

      - alert: FrontierOpenRouterKeyUnavailable
        expr: frontier_openrouter_key_available{service="admin"} == 0
        for: 15m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "OpenRouter key snapshot is unavailable"
          description: "Admin could not fetch OpenRouter key state for more than 15 minutes. Check outbound access, key validity, and OpenRouter API reachability."

      - alert: FrontierOpenRouterCatalogRefreshStale
        expr: time() - frontier_openrouter_catalog_refresh_timestamp_seconds{service="admin"} > 2700
        for: 10m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "OpenRouter catalog refresh is stale"
          description: "Admin has not refreshed the OpenRouter free-model catalog for more than 45 minutes. Dynamic routing may keep using outdated capability or availability data."

      - alert: FrontierOpenRouterCatalogUnavailable
        expr: frontier_openrouter_catalog_available{service="admin"} == 0
        for: 15m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "OpenRouter catalog snapshot is unavailable"
          description: "Admin could not fetch a usable OpenRouter free-model catalog for more than 15 minutes. Picker quality and model awareness are degraded."

      # 2026-08-04: заменило FrontierOpenRouterModelQuarantineBurst, которое стреляло
      # на ФАКТ карантина: `sum(frontier_openrouter_model_quarantine{service="admin"}) >= 3`.
      #
      # Измерение за 7 суток показало, что этот факт наступает каждые сутки и вреда
      # не означает. У 14 из 16 бесплатных моделей `in_quarantine_until` равен РОВНО
      # ближайшей полуночи UTC, а `last_error` и `consecutive_errors` пусты — то есть
      # это исчерпание суточной квоты бесплатного тарифа, которое снимается само.
      # Правило было firing 6 суток из 7 по 3-11 часов и слало warning в Telegram,
      # а picker за то же окно не пропустил НИ ОДНОГО запроса по причине карантина
      # (единственная наблюдавшаяся причина пропуска — openrouter_fail_safe_catalog_missing,
      # см. отдельный пункт реестра). Отношение карантина к вреду за неделю: 0 из 6.
      #
      # Алерт, который кричит каждый день на норме, обучает не смотреть на алерты —
      # это зеркало «молчаливого отказа», против которого написана половина этого файла.
      # Поэтому теперь условие привязано к вреду: широкий карантин И picker из-за него
      # реально отказывает. Штатное ночное исчерпание квоты молчит.
      #
      # Карантин как таковой из наблюдаемости не пропал: gauge
      # frontier_openrouter_model_quarantine остаётся и виден на дашборде RSI —
      # он диагностический, а не будящий.
      - alert: FrontierOpenRouterFreePoolUnusable
        expr: |
          sum by (service) (
            increase(frontier_openrouter_picker_skip_total{reason=~"all_quarantined|no_capable_model|guard_quarantine"}[30m])
          ) >= 3
          and on (service)
          sum by (service) (frontier_openrouter_model_quarantine) >= 3
        for: 10m
        labels:
          severity: warning
          notify: telegram
        annotations:
          summary: "OpenRouter free pool is quarantined AND the picker is failing because of it"
          description: "{{ $labels.service }}: picker skipped {{ $value }} requests in 30 minutes with a quarantine-related reason while three or more free models are quarantined. Unlike plain quarantine (which happens nightly when the free daily quota resets and is harmless), this means requests are actually being denied — expect spillover to paid providers."

      - alert: FrontierOpenRouterPickerSkipBurst
        expr: sum by (service, task_family, reason) (increase(frontier_openrouter_picker_skip_total{service="worker",reason=~"guard_.*|near_cap|all_quarantined|no_capable_model"}[15m])) >= 5
        for: 10m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "OpenRouter picker is repeatedly skipping requests"
          description: "OpenRouter picker skips for {{ $labels.service }}/{{ $labels.task_family }} (reason={{ $labels.reason }}) increased by {{ $value }} in 15 minutes. This usually means quarantine, cap pressure, or no compatible free model."

      - alert: FrontierOpenRouterNonFreeModelBlocked
        expr: sum by (service, task_family) (increase(frontier_openrouter_picker_skip_total{service="worker",reason="non_free_model_blocked"}[15m])) >= 1
        for: 1m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "OpenRouter non-free model attempt was blocked"
          description: "Runtime blocked non-free OpenRouter model usage for {{ $labels.service }}/{{ $labels.task_family }}. Check policy overrides and enforce free-only routing inputs."

      - alert: FrontierOpenRouterNearDailyCap
        expr: max by (service, model_id) (frontier_openrouter_rpd_used{service="admin"}) >= 750
        for: 10m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "An OpenRouter free model is nearing the daily soft cap"
          description: "{{ $labels.model_id }} has already reserved {{ $value }} OpenRouter free requests today. Expect picker skips, more quarantine pressure, and more spillover to Polza or Giga."

      - alert: FrontierOpenRouterVisionFallbackBurst
        expr: sum by (service, to_provider, reason) (increase(frontier_openrouter_vision_fallbacks_total{service="worker"}[15m])) >= 5
        for: 10m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "OpenRouter vision fallback traffic is spiking"
          description: "OpenRouter vision fallbacks from {{ $labels.service }} to {{ $labels.to_provider }} (reason={{ $labels.reason }}) increased by {{ $value }} in 15 minutes. Vision cost and latency are likely rising."

      - alert: FrontierOpenRouterTextFallbackBurst
        expr: sum by (service, task, to_provider, reason) (increase(frontier_llm_fallbacks_total{service="worker",from_provider="openrouter"}[15m])) >= 5
        for: 10m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "OpenRouter text fallback traffic is spiking"
          description: "OpenRouter text fallbacks for {{ $labels.service }}/{{ $labels.task }} to {{ $labels.to_provider }} (reason={{ $labels.reason }}) increased by {{ $value }} in 15 minutes. The text chain is bypassing OR more often than expected."

      - alert: FrontierOpenRouterFinopsDrift
        expr: abs(frontier_llm_finops_reconciliation_gap{service="admin",provider="openrouter",kind="openrouter_free_daily_requests"}) >= 200
        for: 60m
        labels:
          severity: warning
          service: admin
        annotations:
          summary: "OpenRouter runtime usage is drifting from published daily accounting"
          description: "The gap between runtime free-request accounting and the cached OpenRouter daily usage snapshot stayed above {{ $value }} requests for 15 minutes. Check stale key refreshes, unexpected OR traffic, or accounting mismatches."

      - alert: FrontierLLMCostDriftTotal
        expr: abs(frontier_llm_finops_runtime_drift_total{service="admin"}) >= 100
        for: 15m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "LLM runtime cost drift is accumulating"
          description: "Provider {{ $labels.provider }} has accumulated {{ $value }} credits of actual-vs-estimated cost drift. Check pricing assumptions, fallback mix, and provider billing reconciliation."

      - alert: FrontierLLMFinopsSnapshotStale
        expr: frontier_llm_finops_status{service="admin",status="stale"} == 1
        for: 20m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "LLM finops reconciliation is running from stale provider snapshots"
          description: "Provider {{ $labels.provider }} is being reconciled from stale cached state for more than 20 minutes. Refresh lag can hide quota pressure or accounting drift."

      - alert: FrontierPolzaRateLimitBurst
        expr: sum by (service, operation) (increase(frontier_rate_limit_events_total{upstream="polza"}[10m])) >= 6
        for: 10m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Polza is rate-limiting production traffic"
          description: "Polza 429 events for {{ $labels.service }}/{{ $labels.operation }} increased by {{ $value }} in the last 10 minutes. Spillover to GigaChat may accelerate."

      - alert: FrontierPolzaErrorBurst
        expr: sum by (service, task) (increase(frontier_llm_requests_total{service="worker",provider="polza",status="error"}[15m])) >= 10
        for: 15m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Polza is returning repeated errors"
          description: "Polza request errors for {{ $labels.service }}/{{ $labels.task }} increased by {{ $value }} in 15 minutes. Check provider health, model availability, and outbound connectivity."

      - alert: FrontierPolzaVisionErrorBurst
        expr: sum by (service) (increase(frontier_polza_vision_requests_total{service="worker",status="error"}[15m])) >= 6
        for: 15m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Polza vision fallback is returning repeated errors"
          description: "Polza vision errors for {{ $labels.service }} increased by {{ $value }} in 15 minutes. Mass-vision fallback may spill directly into GigaChat."

      - alert: FrontierPolzaFallbackBurst
        expr: sum by (service, task, reason, to_provider) (increase(frontier_llm_fallbacks_total{service="worker",from_provider="polza"}[15m])) >= 8
        for: 15m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Polza fallback traffic is spiking"
          description: "Polza fallbacks for {{ $labels.service }}/{{ $labels.task }} to {{ $labels.to_provider }} (reason={{ $labels.reason }}) increased by {{ $value }} in 15 minutes. Tertiary spillover to GigaChat is now material."

      - alert: FrontierRedisStreamLagHigh
        expr: frontier_redis_stream_lag{service="admin"} > 2000
        for: 10m
        labels:
          severity: warning
          service: admin
        annotations:
          summary: "Redis stream lag is growing"
          description: "{{ $labels.stream }}/{{ $labels.group }} lag is {{ $value }}. Check worker throughput and pending reclaim."

      - alert: FrontierRedisStreamLagCritical
        expr: frontier_redis_stream_lag{service="admin"} > 5000
        for: 10m
        labels:
          severity: critical
          service: admin
          notify: telegram
        annotations:
          summary: "Redis stream lag is critically high"
          description: "{{ $labels.stream }}/{{ $labels.group }} lag is {{ $value }} for more than 10 minutes. New events are not being processed in time."

      - alert: FrontierRedisStreamPendingHigh
        expr: frontier_redis_stream_pending{service="admin"} > 250
        for: 10m
        labels:
          severity: warning
          service: admin
        annotations:
          summary: "Redis stream pending backlog is growing"
          description: "{{ $labels.stream }}/{{ $labels.group }} pending is {{ $value }}. Check consumer crashes, XAUTOCLAIM reclaim, and DLQ."

      - alert: FrontierRedisStreamOldestPendingTooOld
        expr: frontier_redis_stream_oldest_pending_age_seconds{service="admin"} > 1800
        for: 15m
        labels:
          severity: warning
          service: admin
        annotations:
          summary: "Oldest pending Redis stream message is too old"
          description: "{{ $labels.stream }}/{{ $labels.group }} has a pending message older than {{ $value }} seconds."

      - alert: FrontierAdminSchedulerNotRunning
        expr: frontier_admin_scheduler_running{service="admin"} == 0
        for: 5m
        labels:
          severity: critical
          service: admin
          notify: telegram
        annotations:
          summary: "Admin scheduler is not running"
          description: "Scheduled maintenance jobs in admin are stopped. Cron-based source scoring, signal analysis, and balance refresh are not executing."

      - alert: FrontierManualSignalJobRunningTooLong
        expr: frontier_admin_manual_job_oldest_running_age_seconds{service="admin",job_name=~"run_signal_analysis|run_semantic_clusters"} > 5400
        for: 10m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "Manual analysis job is running too long"
          description: "The oldest {{ $labels.job_name }} job has been running for {{ $value }} seconds. Check worker pressure, model latency, or a stuck subprocess."

      - alert: FrontierManualSignalJobFailedRecently
        expr: frontier_admin_manual_jobs_recent_failures{service="admin",job_name=~"run_signal_analysis|run_semantic_clusters"} > 0
        for: 5m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "Manual analysis job recently failed"
          description: "{{ $labels.job_name }} has {{ $value }} failures in the recent observation window. Inspect admin manual job history and logs."

      - alert: FrontierSearxngErrorBurst
        expr: sum by (service, mode) (increase(frontier_searxng_requests_total{status="error"}[15m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: "SearXNG is returning repeated errors"
          description: "{{ $labels.service }} {{ $labels.mode }} queries saw {{ $value }} SearXNG errors in the last 15 minutes. Check upstream engines and SearXNG availability."

      # Статус успеха в этой серии называется "success" — так его пишет
      # worker/services/searxng_client.py через note_searxng_request (единственный
      # производитель метрики). Статуса "ok" не существовало никогда: до
      # 2026-08-04 здесь стоял именно он, селектор не выбирал ни одной серии,
      # `пустой вектор == 0` давал пустой вектор, и правило не могло сработать ни
      # при какой частоте ошибок — при том что severity критический и notify:
      # telegram. Соответствие имён статусов между клиентом и этим файлом
      # проверяется в tests/test_searxng_client_honesty.py.
      #
      # `unless`, а не `(успехи == 0) and (ошибки >= 5)`: у counter'а
      # prometheus_client дочерняя серия создаётся только при ПЕРВОМ инкременте с
      # такими лейблами. Если движки лежат с самого старта процесса (ровно тот
      # случай, ради которого правило и существует), серии со status="success" для
      # этой пары (service, mode) не существует, `increase(...)` пуст, и сравнение
      # `== 0` снова даёт пустой вектор. `unless` вычитает успехи из ошибок и на
      # отсутствующей серии ведёт себя правильно: вычитать нечего — алерт остаётся.
      - alert: FrontierSearxngNoSuccessfulQueries
        expr: (sum by (service, mode) (increase(frontier_searxng_requests_total{status="error"}[30m])) >= 5) unless (sum by (service, mode) (increase(frontier_searxng_requests_total{status="success"}[30m])) > 0)
        for: 10m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "SearXNG grounding is fully degraded"
          description: "{{ $labels.service }} {{ $labels.mode }} has no successful SearXNG queries in 30 minutes while errors continue. Missing-signals grounding is effectively down."

      - alert: FrontierHostRootDiskFilling
        expr: (node_filesystem_avail_bytes{job="node-exporter", mountpoint="/", fstype!=""} / node_filesystem_size_bytes{job="node-exporter", mountpoint="/", fstype!=""}) < 0.15
        for: 10m
        labels:
          severity: warning
          service: host
        annotations:
          summary: "Host root filesystem free space is below 15%"
          description: "Root filesystem on the Docker host has only {{ $value | humanizePercentage }} free. Clean up container logs/cache before Redis/Postgres start failing writes."

      - alert: FrontierHostRootDiskCritical
        expr: (node_filesystem_avail_bytes{job="node-exporter", mountpoint="/", fstype!=""} / node_filesystem_size_bytes{job="node-exporter", mountpoint="/", fstype!=""}) < 0.07
        for: 5m
        labels:
          severity: critical
          service: host
          notify: telegram
        annotations:
          summary: "Host root filesystem free space is below 7%"
          description: "Root filesystem on the Docker host has only {{ $value | humanizePercentage }} free. Expect Redis persistence, Docker exec healthchecks, and Postgres writes to fail."

      - alert: FrontierCoreServiceDown
        expr: up{job=~"worker|ingest|qdrant"} == 0
        for: 5m
        labels:
          severity: critical
          service: '{{ $labels.job }}'
          notify: telegram
        annotations:
          summary: "Core Frontier service is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable from Prometheus for more than 5 minutes."

      - alert: FrontierControlPlaneServiceDown
        expr: up{job="mcp"} == 0
        for: 10m
        labels:
          severity: warning
          service: '{{ $labels.job }}'
        annotations:
          summary: "Control-plane Frontier service is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable from Prometheus for more than 10 minutes."

      - alert: FrontierSupportServiceDown
        expr: up{job=~"crawl4ai|alertmanager|node-exporter"} == 0
        for: 10m
        labels:
          severity: warning
          service: '{{ $labels.job }}'
        annotations:
          summary: "Support service is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable for more than 10 minutes."

  - name: frontier_rsi
    rules:
      # Admin держит ВЕСЬ планировщик (кластеризация, retro-петля, judge, audit, graph).
      # Крэш-луп admin = up=0 = метрика scheduler_running вообще не приходит, поэтому
      # FrontierAdminSchedulerNotRunning НЕ сработает. Ловим именно по up.
      - alert: FrontierAdminDown
        expr: up{job="admin"} == 0
        for: 5m
        labels:
          severity: critical
          service: admin
          notify: telegram
        annotations:
          summary: "Admin is down — весь ночной планировщик RSI стоит"
          description: "admin недоступен для Prometheus >5м. Все ночные джобы (clustering, retro-review, novelty-judge, relevance-audit, graph-maintenance, entity-resolution) могут НЕ выполняться. Две основные причины: (1) крэш-луп из-за нехватки worker-зависимости в admin-образе — проверь docker inspect admin (RestartCount>0) и логи; (2) блокировка event-loop тяжёлой CPU-джобой (signal_analysis/semantic_clustering) — RestartCount=0, ищи пробел в логах вокруг окна. Тяжёлые джобы вынесены в субпроцессы (scheduler._run_job_subprocess), поэтому (2) не должно повторяться."

      - alert: FrontierGraphDuplicateClustersRising
        expr: max by (workspace) (frontier_graph_health{metric="duplicate_clusters"}) > 100
        for: 30m
        labels:
          severity: warning
          service: worker
        annotations:
          summary: "Дубли концепт-графа снова копятся в {{ $labels.workspace }}"
          description: "duplicate_clusters = {{ $value }} для {{ $labels.workspace }}. Нормализация на записи или UNIQUE-constraint (norm, workspace_id) могли сломаться. Проверь constraint и запусти graph-resolution."

      - alert: FrontierNoveltyJudgeFailing
        expr: |
          (sum(increase(frontier_novelty_judge_total{verdict="failed"}[6h])) >= 10)
          and
          (sum(increase(frontier_novelty_judge_total{verdict=~"underrated|confirmed_weak"}[6h])) == 0)
        for: 30m
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Кросс-семейный novelty-judge падает на всех кандидатах"
          description: "За 6ч все вердикты судьи — failed, успешных ноль. Похоже, обе семьи DeepSeek (wormsoft + polza) недоступны. Судья слепых зон и ранний сигнал B→A фактически выключены."

      # NoNewPosts: пороги дифференцированы по объёму workspace, чтобы штатная ночная
      # тишина низкообъёмных workspace не поднимала ложный CRITICAL.
      #   Высокообъёмные (disruption, ai_products_media, …) — 6ч warn / 12ч crit.
      #   Низкообъёмные (design, ai_research, ai_trends, auto_hmi) живут на 1–2 источниках
      #   и штатно молчат ночью до ~17ч → им 24ч warn / 36ч crit.
      # auto_hmi добавлен 2026-08-03: воркспейс стартует с 1-3 включённых источников
      # (батч batch:auto_hmi раскатывается по одному), метрика появляется с первым же
      # постом — на высокообъёмных порогах он ложно сработал бы в первую тихую ночь.
      # Матчеры взаимоисключающие, поэтому одинаковое имя алерта не конфликтует
      # (инстансы различаются лейблом workspace).
      # LOW_VOLUME_SET: design|ai_research|ai_trends|auto_hmi — правится во всех ЧЕТЫРЁХ
      # выражениях ниже сразу (два !~ для high_volume, два =~ для low_volume).
      - alert: FrontierNoNewPosts
        expr: max by (workspace) (frontier_last_post_age_seconds{workspace!~"design|ai_research|ai_trends|auto_hmi"}) > 21600
        for: 15m
        labels:
          severity: warning
          service: admin
          tier: high_volume
        annotations:
          summary: "Данные перестали поступать в {{ $labels.workspace }}"
          description: "Свежайшему посту в {{ $labels.workspace }} уже {{ $value | humanizeDuration }} (>6ч). Ingest, парсинг или запись в БД могли встать. Проверь source_runs, логи ingest/worker и Redis stream:posts:parsed."

      - alert: FrontierNoNewPostsCritical
        expr: max by (workspace) (frontier_last_post_age_seconds{workspace!~"design|ai_research|ai_trends|auto_hmi"}) > 43200
        for: 15m
        labels:
          severity: critical
          service: admin
          notify: telegram
          tier: high_volume
        annotations:
          summary: "Полная тишина данных в {{ $labels.workspace }}"
          description: "Свежайшему посту в {{ $labels.workspace }} уже {{ $value | humanizeDuration }} (>12ч). Пайплайн приёма данных, вероятно, полностью стоит. Немедленно проверь ingest, worker и запись в posts."

      # Низкообъёмные workspace: мягкие пороги (24ч warn / 36ч crit).
      - alert: FrontierNoNewPosts
        expr: max by (workspace) (frontier_last_post_age_seconds{workspace=~"design|ai_research|ai_trends|auto_hmi"}) > 86400
        for: 15m
        labels:
          severity: warning
          service: admin
          tier: low_volume
        annotations:
          summary: "Данные перестали поступать в {{ $labels.workspace }} (низкообъёмный)"
          description: "Свежайшему посту в {{ $labels.workspace }} уже {{ $value | humanizeDuration }} (>24ч, порог низкообъёмного workspace). Проверь source_runs, логи ingest/worker и Redis stream:posts:parsed."

      - alert: FrontierNoNewPostsCritical
        expr: max by (workspace) (frontier_last_post_age_seconds{workspace=~"design|ai_research|ai_trends|auto_hmi"}) > 129600
        for: 15m
        labels:
          severity: critical
          service: admin
          notify: telegram
          tier: low_volume
        annotations:
          summary: "Полная тишина данных в {{ $labels.workspace }} (низкообъёмный)"
          description: "Свежайшему посту в {{ $labels.workspace }} уже {{ $value | humanizeDuration }} (>36ч, порог низкообъёмного workspace). Пайплайн приёма данных, вероятно, стоит. Проверь ingest, worker и запись в posts."

  # ── Свежесть аналитического слоя ────────────────────────────────────────────
  # Инцидент 31.07–02.08.2026: clustering и signal-analysis падали на всех 5
  # workspace 54 часа, а APScheduler рапортовал "executed successfully" — потому
  # что error-хендлер пишет UPDATE cluster_runs в уже аборченной транзакции и
  # падает сам. В cluster_runs за 3 дня: 47 строк 'running', НОЛЬ строк 'error'.
  # Вывод: алертить по статусу джоба нельзя, он врёт. Смотрим на результат в
  # данных — сдвинулся ли max(updated_at). Метрику пишет по cron
  # scripts/export-analysis-freshness.sh в node_exporter textfile collector.
  - name: frontier_analysis_freshness
    rules:
      # Штатно полный пересчёт идёт ночью (cron 03:35), т.е. возраст до ~24ч —
      # норма. 48ч = пропущено два ночных прогона подряд.
      #
      # 2026-08-04: экспортёр расширен с двух таблиц до пяти, и селектор по `table`
      # появился здесь НЕ для сужения, а чтобы не смешать разные по смыслу молчания.
      # Для emerging_signals / semantic_clusters / missing_signals тишина означает
      # поломку слоя и будит дежурного. Для trend_clusters она означает, что кандидаты
      # не прошли структурные ворота (>=2 кластера, >=3 документа, >=2 источника) —
      # это не отказ, а свойство низкопоточных воркспейсов, и решение по нему за
      # владельцем (развилка 29 в AUDIT-2026-08-04). Поэтому у trend_clusters
      # отдельное правило ниже, info и без notify. Для card_feedback правила нет
      # вовсе: ноль строк там ожидаем.
      - alert: FrontierAnalysisStale
        expr: time() - max by (workspace, table) (frontier_analysis_last_update_timestamp_seconds{table=~"emerging_signals|semantic_clusters|missing_signals"}) > 172800
        for: 15m
        labels:
          severity: warning
          service: admin
          notify: telegram
        annotations:
          summary: "Аналитика {{ $labels.table }} не обновлялась в {{ $labels.workspace }}"
          description: "Последняя запись в {{ $labels.table }} для {{ $labels.workspace }} была {{ $value | humanizeDuration }} назад (>48ч). Ingest при этом может быть полностью здоров — проверять надо аналитический слой. ВАЖНО: статус джоба смотреть бесполезно, провал пишется как success. Первопричину ошибок схемы видно ТОЛЬКО в `docker logs frontier-intelligence-postgres-1`, в логах admin её нет. Перезапуск вручную: docker exec frontier-intelligence-admin-1 python -m admin.backend.manual_jobs run_semantic_clusters <workspace>"

      - alert: FrontierAnalysisStaleCritical
        expr: time() - max by (workspace, table) (frontier_analysis_last_update_timestamp_seconds{table=~"emerging_signals|semantic_clusters|missing_signals"}) > 345600
        for: 15m
        labels:
          severity: critical
          service: admin
          notify: telegram
        annotations:
          summary: "Аналитика {{ $labels.table }} стоит четвёртые сутки ({{ $labels.workspace }})"
          description: "Последняя запись в {{ $labels.table }} для {{ $labels.workspace }} была {{ $value | humanizeDuration }} назад (>96ч). MCP отдаёт клиентам устаревшие кластеры и сигналы без признака устаревания. Проверь миграции БД (расхождение схемы с кодом — известная причина), OOM субпроцессов admin и логи postgres."

      # Страховка от тихой смерти самого экспортёра: если cron перестанет писать
      # .prom-файл, серия исчезнет и оба правила выше замолчат, не зафиксировав
      # ни одного отказа. Ровно так уже умер FrontierManualSignalJobFailedRecently,
      # который висит на пустом векторе с 10.04.2026 и не может сработать в принципе.
      - alert: FrontierAnalysisFreshnessExporterDown
        expr: absent(frontier_analysis_last_update_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
          service: monitoring
          notify: telegram
        annotations:
          summary: "Экспортёр свежести аналитики молчит"
          description: "Серия frontier_analysis_last_update_timestamp_seconds отсутствует >30м, значит FrontierAnalysisStale сейчас не может сработать в принципе. Проверь cron scripts/export-analysis-freshness.sh, каталог prometheus/textfile и флаг --collector.textfile.directory у node-exporter."

      # Трендовая тишина. Отдельно от правил выше и намеренно тише их.
      #
      # На 04.08.2026 у `design` последний тренд датирован 14.07 (21 день), у
      # `ai_products_media` — 02.08. Всё это время метрика свежести по этим
      # воркспейсам показывала 2-3 часа, потому что считалась по другим таблицам:
      # emerging-слой у них живой, а до стабильного тренда кандидаты не доходят.
      #
      # Это не отказ, а следствие структурных ворот при 94-97% синглтонов, поэтому
      # правило существует для видимости, а не для побудки. Как только развилка 29
      # (снижать ли минимумы для низкопоточных воркспейсов) будет решена, оно либо
      # начинает будить, либо уходит вместе с признанием, что стабильных трендов
      # там не должно быть.
      #
      # `notify: never` ОБЯЗАТЕЛЕН, и это не то же самое, что «не ставить notify».
      # Проверено `amtool config routes test` на рабочем конфиге: в blackhole уходит
      # ровно два маршрута — alertname="FrontierWatchdog" и notify="never", а всё
      # остальное подхватывает catch-all `telegram-admin`. Правило с severity=info
      # и без метки notify уходило в Telegram и повторялось каждые 6 часов
      # (repeat_interval) — то есть ровно то ежедневное нытьё на известном состоянии,
      # от которого этим же заходом избавлялись в карантинном алерте OpenRouter.
      # Первая редакция этого правила была написана именно так и поймана проверкой
      # маршрутизации, а не чтением.
      #
      # Порог 7 суток, а не 48 часов: у низкопоточного воркспейса неделя без нового
      # стабильного тренда — в пределах наблюдавшейся нормы.
      - alert: FrontierTrendClustersStale
        expr: time() - max by (workspace) (frontier_analysis_last_update_timestamp_seconds{table="trend_clusters"}) > 604800
        for: 1h
        labels:
          severity: info
          service: admin
          notify: never
        annotations:
          summary: "Стабильные тренды не появлялись в {{ $labels.workspace }} больше недели"
          description: "Последний стабильный тренд в {{ $labels.workspace }} записан {{ $value | humanizeDuration }} назад (>7д). Emerging-слой при этом может быть полностью живым: кандидаты не проходят структурные ворота (>=2 semantic clusters, >=3 документа, >=2 источника). Это ожидаемо для низкопоточных воркспейсов и ждёт решения владельца — развилка 29 в docs/AUDIT-2026-08-04.md. Намеренно notify=never: правило для видимости в списке алертов и на дашборде, не для побудки."

      # Сигнал живости ежедневной петли разбора алертов (docs/runbooks/alert-triage-daily.md).
      #
      # 03.08 и 04.08.2026 петля упала два дня подряд: задача Task Scheduler отдала
      # LastTaskResult 3221225786 (0xC000013A, STATUS_CONTROL_C_EXIT), в .claude/alert-triage.log
      # два маркера `start` подряд без парного `exit=`, дайджестов за эти дни нет.
      # Не сработало НИЧТО: у петли не было ни одного сигнала о собственной смерти.
      # Это тот же класс, что FrontierAnalysisStale, только про инструмент, а не про данные.
      #
      # Наблюдатель намеренно НЕ внутри петли: свежесть считается по времени записи
      # последнего дайджеста на сервере, поэтому умирающая сторона не обязана
      # сообщать о собственной смерти. Порог 26ч, а не 24: петля ходит раз в сутки
      # в 09:15, и в здоровом режиме возраст дайджеста доходит почти до 24ч перед
      # очередным прогоном. Порог 24ч давал бы ложное срабатывание каждую ночь —
      # ровно та болезнь, от которой этим же заходом лечили карантинный алерт.
      - alert: FrontierAlertTriageStale
        expr: absent(frontier_alert_triage_last_digest_timestamp_seconds) or (time() - frontier_alert_triage_last_digest_timestamp_seconds) > 93600
        for: 30m
        labels:
          severity: warning
          service: monitoring
          notify: telegram
        annotations:
          summary: "Ежедневный разбор алертов не отдал дайджест (>26ч)"
          description: "Свежий дайджест в docs/ops/alert-digests/ не появлялся дольше 26 часов, значит петля /alert-triage не отработала. Смотри Get-ScheduledTaskInfo FrontierAlertTriage на рабочей машине и хвост .claude/alert-triage.log: маркер `start` без парного `exit=` означает, что процесс убили (0xC000013A — консольный сигнал, проверь настройки задачи и закрытие сессии)."

  # Dead man's switch. Правило firing ВСЕГДА, по построению — доставлять его
  # некуда и незачем, в alertmanager.yml оно уходит в blackhole первым же
  # маршрутом. Ценность у него ровно обратная: его ОТСУТСТВИЕ есть признак
  # того, что связка Prometheus -> правила -> Alertmanager развалилась.
  #
  # Читает его снаружи scripts/alert-watchdog.sh по cron: он опрашивает
  # /api/v2/alerts, и если FrontierWatchdog пропал или протух, шлёт сообщение
  # в Telegram напрямую через socks5 — путём, который не разделяет с этой
  # связкой ни одного звена.
  #
  # Нужно потому, что до 04.08.2026 вся доставка шла единственным вебхуком
  # в admin: за 7 дней 135 провалов из 296, и все в окно, когда admin лежал.
  # Молчание системы мониторинга было неотличимо от отсутствия проблем.
  - name: frontier_watchdog
    rules:
      # `for: 0s` и severity из допустимого набора — не формальность, а требование
      # контракта репозитория (tests/test_alerts_workspace_coverage.py): правило без
      # `for` стреляет с одного скрейпа, а severity вне {critical,info,warning} не
      # матчится ни одним маршрутом alertmanager и уходит в никуда. Изначально здесь
      # стояли отсутствующий `for` и severity: none — тест это поймал.
      #
      # На доставку severity тут не влияет: глушит МАРШРУТ по alertname, стоящий в
      # alertmanager.yml первым, а не отсутствие severity. `for: 0s` задан явно —
      # watchdog обязан быть firing немедленно и всегда, в этом весь его смысл.
      - alert: FrontierWatchdog
        expr: vector(1)
        for: 0s
        labels:
          severity: info
          service: monitoring
          notify: watchdog
        annotations:
          summary: "Контур алертинга жив"
          description: "Синтетический алерт, firing постоянно. Проверяется снаружи: scripts/alert-watchdog.sh следит, что он присутствует в Alertmanager и не протух. Если ты видишь это сообщение в Telegram — сломана маршрутизация: правило должно глушиться в blackhole."

      # Обратная сторона: watchdog следит за контуром, а это правило — за watchdog.
      # Ловит случай, когда контур цел, а сам наблюдатель умер (cron снят, docker
      # недоступен, скрипт падает). Идёт штатным путём — если сломано и то и другое,
      # сработает первый, а не этот.
      - alert: FrontierWatchdogStale
        expr: absent(frontier_watchdog_last_run_timestamp_seconds)
          or (time() - frontier_watchdog_last_run_timestamp_seconds) > 3600
        for: 15m
        labels:
          severity: warning
          service: monitoring
          notify: telegram
        annotations:
          summary: "Наблюдатель контура алертинга молчит"
          description: "scripts/alert-watchdog.sh не отчитывался больше часа (или серия отсутствует). Значит внешняя проверка доставки сейчас не работает, и падение контура алертинга снова станет незаметным. Проверь cron на хосте и хвост backups/watchdog.log."

  # Бэкапы. До 04.08.2026 среди 56 правил не было НИ ОДНОГО про backup или S3:
  # ночной прогон мог падать сколько угодно, единственным следом оставалась
  # строка в backups/cron.log, которую никто не читает.
  - name: frontier_backup
    rules:
      - alert: FrontierBackupStale
        expr: absent(frontier_backup_last_success_timestamp_seconds)
          or (time() - frontier_backup_last_success_timestamp_seconds) > 129600
        for: 30m
        labels:
          severity: critical
          service: backup
          notify: telegram
        annotations:
          summary: "Успешного бэкапа не было больше полутора суток"
          description: "frontier_backup_last_success_timestamp_seconds старше 36ч (или серии нет вовсе). Крон стоит на 03:30 ежедневно, значит пропущен минимум один прогон. Смотри хвост backups/backup.log: чаще всего это переполнение квоты S3 либо недоступность эндпоинта. Проверить целостность того, что есть: bash scripts/restore-stack.sh verify"

      # Порог в 36ч у правила выше выбран так, чтобы одна пропущенная ночь не
      # будила зря, а две подряд — будили. RTO восстановления БД измерен
      # учением: 84с на 580 МБ.
      #
      # Здесь порог 12ч, а не 24ч. При кроне ровно раз в сутки первый же
      # провал даёт разницу РОВНО 86400 секунд, поэтому условие `> 86400`
      # давало точное равенство и молчало — правило ловило бы только второй
      # провал подряд, то есть позже, чем FrontierBackupStale, и не добавляло
      # ничего. Полусуточный порог не может сработать на успешном прогоне:
      # при успехе last_run == last_success и разница равна нулю.
      - alert: FrontierBackupRunFailing
        expr: frontier_backup_last_run_timestamp_seconds
          - frontier_backup_last_success_timestamp_seconds > 43200
        for: 30m
        labels:
          severity: warning
          service: backup
          notify: telegram
        annotations:
          summary: "Бэкап запускается, но завершается с ошибками"
          description: "Последний СТАРТ новее последнего УСПЕХА больше чем на сутки: прогон идёт и падает на каком-то шаге. Именно этот случай самый тихий — файлы в каталоге есть, а часть из них не доехала. Смотри строки '!!! FAILED' в backups/backup.log."

      - alert: FrontierS3QuotaHigh
        expr: frontier_s3_quota_bytes > 0
          and frontier_s3_bucket_bytes / frontier_s3_quota_bytes > 0.85
        for: 1h
        labels:
          severity: warning
          service: backup
          notify: telegram
        annotations:
          summary: "Бакет заполнен более чем на 85%"
          description: "Занято {{ $value | humanizePercentage }} квоты. 02.08.2026 бакет уже упирался в потолок, и из-за этого не доезжал самый важный файл. Разбор наполнения: docker run --rm --env-file .env <worker-образ> python /scripts/s3_bucket_usage.py"

      # scalar(sum(...)) — не косметика. sum() сбрасывает ВСЕ метки, а левая часть
      # сохраняет instance/job, поэтому сравнение двух векторов не находит ни одной
      # пары рядов и молча возвращает пустоту: правило не сработало бы никогда,
      # притом что условие истинно. Поймано при проверке выражения на живых данных
      # (свободно 1.81 GiB против 3.56 GiB на один бэкап) — ровно тот класс
      # молчаливого отказа, ради которого всё это и делается.
      - alert: FrontierS3QuotaCritical
        expr: frontier_s3_quota_bytes > 0
          and (frontier_s3_quota_bytes - frontier_s3_bucket_bytes)
              < scalar(sum(frontier_backup_artifact_bytes))
        for: 1h
        labels:
          severity: critical
          service: backup
          notify: telegram
        annotations:
          summary: "В бакете меньше места, чем весит один суточный бэкап"
          description: "Свободного места в квоте не хватит на следующий ночной прогон — он упадёт на выгрузке. Это не прогноз, а арифметика по текущим размерам артефактов. Освободить: scripts/s3_prune_dead_snapshots.py и lifecycle-политика (scripts/s3_lifecycle_apply.py)."

      - alert: FrontierBackupMetricsExporterDown
        expr: absent(frontier_backup_last_run_timestamp_seconds)
        for: 2h
        labels:
          severity: warning
          service: monitoring
          notify: telegram
        annotations:
          summary: "Экспортёр метрик бэкапа молчит"
          description: "Серии frontier_backup_* отсутствуют больше 2ч, значит все правила группы frontier_backup сейчас не могут сработать в принципе. Проверь cron scripts/export-backup-metrics.sh и каталог prometheus/textfile."

  # Покрытие кластеризации. Свежесть отвечает на вопрос «слой шевелится?», но не
  # на «сколько корпуса он видит». 04.08.2026 у disruption свежесть была в норме
  # (прогон каждую ночь), а кластеризация видела 40% окна: выборка берёт N самых
  # свежих постов, а поток вдвое больше N. Потолок был дефолтным, потому что
  # единственному крупному воркспейсу его так и не настроили.
  - name: frontier_clustering_coverage
    rules:
      # ПРЯМАЯ проверка инварианта: суточный приток против потолка выборки.
      #
      # Здесь была попытка ловить регрессию через deriv(coverage[2d]) < 0. Она
      # НЕ РАБОТАЕТ и была снята через два часа после появления: покрытие —
      # ПИЛА. Знаменатель (подходящие посты окна) растёт на каждом скрейпе,
      # числитель прыгает раз в сутки после прогона в 03:35, поэтому ВНУТРИ
      # СУТОК серия убывает всегда. Правило встало в pending через 15 минут
      # после того, как метрика появилась, и должно было сработать по здоровому
      # процессу — по тому самому, который заход 3 только что и починил.
      # Замер: 15:05 0.4446 → 16:45 0.4418, одиннадцать точек, ни одного роста,
      # deriv = -5.25e-07 при окне [2d] против полутора часов истории серии.
      #
      # Настоящий инвариант не нуждается в производной: если СУТОЧНЫЙ ПРИТОК
      # больше потолка, выборка «N самых свежих» физически не может охватить
      # всё, сколько её ни наблюдай. Это видно сразу, на первой же точке, и не
      # зависит ни от длины истории, ни от фазы суток.
      - alert: FrontierClusteringCeilingTooSmall
        expr: >
          frontier_clustering_eligible_posts / frontier_clustering_window_days
          > 0.8 * frontier_clustering_max_posts
        for: 2h
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Потолок кластеризации мал для потока {{ $labels.workspace }}"
          description: "Суточный приток подходящих постов приблизился к semantic_cluster_max_posts или превысил его: выборка берёт N самых свежих, остальное не кластеризуется никогда. Именно так disruption держал покрытие 40% при потолке 400 и потоке ~1000/сут. Потолок правится в config/workspaces.yml, extra.cluster_analysis — и НЕ забудь про docker cp в контейнеры, config/ запечён в образ. Цена подъёма — матрица попарных косинусов O(n^2) и время прогона: 400 постов = 37с, 2000 = 484-552с при таймауте субпроцесса 1800с (поднят 05.08.2026 вместе с переносом крона на 05:00, вне окна ночного бэкапа)."

      # Страховочный абсолютный порог: покрытие рухнуло разом (сломался прогон,
      # а не потолок). Порог 0.3 выбран ниже текущих 44% у disruption сознательно —
      # он не должен срабатывать, пока идёт штатное восстановление после подъёма
      # потолка, иначе повторится та же беда, что и с правилом выше.
      # `for: 2h`, а не сутки. Долгий дебаунс тут ничего не добавляет: если прогон
      # сломался, покрытие сползает медленно (знаменатель растёт, числитель стоит),
      # и порог 0.3 пересекается через дни — лишние сутки ожидания только оттягивают
      # сообщение. Заодно укладывается в границы контракта из
      # tests/test_alerts_workspace_coverage.py.
      - alert: FrontierClusteringCoverageCritical
        expr: frontier_clustering_coverage_ratio < 0.3
        for: 2h
        labels:
          severity: warning
          service: worker
          notify: telegram
        annotations:
          summary: "Кластеризация видит менее 30% окна у {{ $labels.workspace }}"
          description: "Покрытие {{ $value | humanizePercentage }} держится сутки. Трендовый и emerging-слой строятся на этой выборке, значит клиентам MCP отдаётся картина по трети корпуса. Проверь cluster_runs на ошибки и semantic_cluster_max_posts у воркспейса."
