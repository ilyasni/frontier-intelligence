use_default_settings:
  engines:
    keep_only:
      # Keep only engines that are stable for our self-hosted LAN/VPN setup.
      # As of 2026-05-03 these were the engines that consistently returned results
      # from the production host, while brave hit 429s and bing news produced parser errors.
      - duckduckgo
      - startpage
      - qwant
      - bing
server:
  limiter: false
  public_instance: false
  # Required by SearXNG. Do not commit the real value from the server.
  # On the server run: bash scripts/server-ensure-searxng-secret.sh
  secret_key: "CHANGE_ME_GENERATE_ON_SERVER"
  method: "GET"
  bind_address: "0.0.0.0"
search:
  safe_search: 0
  formats:
    - html
    - json
